<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organizadísimos · Proyectos</title>
<meta name="theme-color" content="#07050f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23140b24'/%3E%3Cpath d='M17 33.5l10 10L47 22' fill='none' stroke='%23b06bff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#07050f;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.08);--line:rgba(168,120,255,.22);--text:#ece7ff;--muted:#948bc4;--accent:#b06bff;--accent2:#35e5ff;--danger:#ff4d6d;--ok:#2ee6a6;--warn:#ff9f43}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center;position:relative;overflow-x:hidden}
  body::before,body::after{content:'';position:fixed;width:60vw;height:60vw;border-radius:50%;filter:blur(90px);opacity:.2;z-index:0;pointer-events:none}
  body::before{background:var(--accent);top:-20%;left:-15%}
  body::after{background:var(--accent2);bottom:-25%;right:-15%}
  h1{font-size:22px;margin:0;font-weight:700;background:linear-gradient(90deg,var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .wrap{width:100%;max-width:1000px;min-width:0;padding:30px 22px 80px;position:relative;z-index:1}
  #loginView{max-width:380px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .user-bar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;min-width:0;max-width:100%}
  .user-bar #whoami{min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav{display:flex;gap:6px;margin:14px 0 22px;flex-wrap:wrap}
  .nav a{font-size:13px;padding:6px 14px;border-radius:9px;text-decoration:none;color:var(--muted);border:1px solid transparent}
  .nav a:hover{color:var(--text)}
  .nav a.on{color:var(--text);border-color:var(--line);background:var(--panel)}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap;text-decoration:none;display:inline-block}
  .btn:hover{border-color:var(--accent2)}
  .btn.sm{padding:3px 9px;font-size:11.5px}
  .btn.danger{color:var(--danger);border-color:rgba(255,77,109,.4)}
  .pbtn{border:none;border-radius:9px;padding:9px 16px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#07050f;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .pbtn.sm{padding:6px 12px;font-size:12px}
  .pbtn:disabled{opacity:.5}
  input,textarea,select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:var(--panel);color:var(--text);outline:none;width:100%}
  input:focus,textarea:focus,select:focus{border-color:var(--accent2)}
  select option{background:#12102a}
  textarea{resize:vertical}
  .msg{font-size:13px;margin-top:12px;padding:9px 11px;border-radius:8px}
  .msg.error{background:rgba(255,77,109,.15);color:#ff8fa3}
  .msg.ok{background:rgba(46,230,166,.14);color:#8ff5d2}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
  .card{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--panel);margin-bottom:14px}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .hint{font-size:11.5px;color:var(--muted)}
  .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
  .bar{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
  .bar.full>i{background:var(--ok)}
  .empty{color:var(--muted);font-size:12.5px;padding:8px 2px}
  .x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 3px;line-height:1}
  .x:hover{color:var(--danger)}
  .hidden{display:none!important}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:13.5px;padding:9px 15px;cursor:pointer;font-family:inherit;margin-bottom:-1px}
  .tabs button.on{color:var(--text);border-bottom-color:var(--accent)}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(4,2,12,.66);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
  .modal{width:100%;max-width:520px;border:1px solid var(--line);border-radius:16px;background:#0d0820;padding:20px}
  .modal h2{margin:0 0 4px;font-size:17px}

  /* Estado del proyecto */
  .pstatus{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:2px 9px;white-space:nowrap;flex:0 0 auto}
  .pstatus-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .estado-select{width:auto;padding:5px 9px;font-size:12px;border-radius:9px}

  /* Menú de acciones (⋮) */
  .menu-wrap{position:relative;flex:0 0 auto}
  .menu-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:15px;line-height:1;padding:0}
  .menu-btn.mini{width:22px;height:22px;font-size:13px}
  .menu-btn:hover{color:var(--text);border-color:var(--accent2)}
  .menu-pop{position:absolute;right:0;top:32px;z-index:40;min-width:190px;background:#141018;border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 8px 26px rgba(0,0,0,.55)}
  .menu-pop button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);font-size:12.5px;padding:8px 10px;border-radius:7px;cursor:pointer;font-family:inherit}
  .menu-pop button:hover{background:rgba(255,255,255,.06)}
  .menu-pop button.danger{color:var(--danger)}
  .menu-pop button:disabled{opacity:.4;cursor:default}

  /* Tarjetas de proyecto */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .pcard{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px 15px;cursor:pointer;transition:border-color .15s}
  .pcard:hover{border-color:var(--accent2)}
  .pcard .t{font-size:15px;font-weight:700;line-height:1.25}
  .pcard .meta{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5}
  .pcard .pcttop{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
  .pcard .pct{font-size:15px;font-weight:700}

  /* Árbol de tareas */
  .tphase{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
  .tphase-h{display:flex;align-items:center;gap:7px;padding:6px 8px 6px 6px;background:var(--panel2);border-bottom:1px solid var(--line);flex-wrap:wrap;cursor:pointer}
  .tphase-h.plegada{border-bottom:none}
  .num{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:18px}
  .chev{flex:0 0 auto;width:11px;text-align:center;color:var(--muted);font-size:9px;transition:transform .18s ease;user-select:none;cursor:pointer}
  .chev.abierta{transform:rotate(90deg)}
  .chev.oculto{visibility:hidden}
  .tphase-h b{font-size:12.5px}
  .tphase-h input.nm{flex:1;min-width:80px;background:none;border:none;padding:0;font-size:12.5px;font-weight:700;color:var(--text)}
  .tphase-h .cnt{font-size:11px;color:var(--muted)}
  .mini-bar{flex:0 0 auto;width:52px;height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
  .mini-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px}
  .mini-bar.full>i{background:var(--ok)}
  .pctm{font-size:10.5px;color:var(--muted);white-space:nowrap;min-width:30px}
  .trow{display:flex;align-items:center;gap:5px;padding:1px 8px 1px 4px;min-height:28px;position:relative;border-bottom:1px solid rgba(168,120,255,.09)}
  .trow:hover{background:rgba(255,255,255,.03)}
  .drop-antes{box-shadow:inset 0 2px 0 0 var(--accent2)}
  .drop-despues{box-shadow:inset 0 -2px 0 0 var(--accent2)}
  .grip{flex:0 0 auto;width:11px;text-align:center;cursor:grab;color:var(--muted);font-size:11px;opacity:0;user-select:none}
  .trow:hover .grip,.tphase-h:hover .grip{opacity:.5}
  .sicon{flex:0 0 auto;width:18px;height:18px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;user-select:none;line-height:1}
  .sicon.done{background:var(--ok);border-color:var(--ok);color:#07050f}
  .sicon.prog{color:var(--accent2);border-color:var(--accent2)}
  .sicon.paused{color:var(--warn);border-color:var(--warn)}
  .sicon.derived{cursor:default;opacity:.85}
  .tname{flex:1;min-width:60px;background:none;border:none;padding:0;font-size:12.5px;color:var(--text)}
  .trow.done .tname{text-decoration:line-through;color:var(--muted)}
  .tpct{font-size:10px;color:var(--muted);white-space:nowrap}
  .eye{flex:0 0 auto;cursor:pointer;font-size:12px;color:var(--muted);opacity:.6;user-select:none}
  .eye.off{color:var(--danger);opacity:.9}
  .tchildren{margin-left:14px;border-left:1px solid var(--line);padding-left:0}
  .tdetail{border-top:1px dashed var(--line);margin:2px 8px 6px 26px;padding-top:8px;display:flex;flex-direction:column;gap:8px}
  .addrow{padding:4px 8px 6px}

  /* Compartir */
  .toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text);cursor:pointer}
  .toggle input{width:auto}
  .linkbox{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .linkbox input{flex:1;min-width:180px;font-size:12px}

  /* Bitácora */
  .form-log{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel);margin:8px 0 16px}
  .timeline{position:relative;margin:0 0 0 5px;padding-left:16px;border-left:1px solid var(--line)}
  .tl-item{position:relative;padding:5px 6px 5px 4px;cursor:pointer;border-radius:6px}
  .tl-item:hover{background:rgba(255,255,255,.03)}
  .tl-dot{position:absolute;left:-21px;top:9px;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg);box-sizing:content-box}
  .tl-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .tl-area{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
  .tl-date{font-size:11px;color:var(--muted)}
  .tl-x{margin-left:auto;opacity:0;font-size:11px}
  .tl-item:hover .tl-x{opacity:.6}
  .tl-sum{font-size:12.5px;color:var(--text);margin-top:1px}
  .tl-detail{margin-top:8px;display:flex;flex-direction:column;gap:8px;cursor:default}
  .tl-field .val{font-size:13px;white-space:pre-wrap;line-height:1.4}
</style>
</head>
<body>

<div class="wrap hidden" id="loginView">
  <h1>Organizadísimos</h1>
  <p class="hint" style="margin:6px 0 22px">Inicia sesión para entrar a tus proyectos.</p>
  <div class="field"><label>Correo</label><input type="email" id="email" placeholder="tu@correo.com"></div>
  <div class="field"><label>Contraseña</label><input type="password" id="password" placeholder="••••••••"></div>
  <button class="pbtn" style="width:100%" id="loginBtn">Entrar</button>
  <div id="loginMsg"></div>
</div>

<div class="wrap hidden" id="appView">
  <div class="topbar">
    <h1>Organizadísimos</h1>
    <div class="user-bar"><span id="whoami"></span><button class="btn" id="outBtn">Salir</button></div>
  </div>
  <div class="nav">
    <a href="/dashboard/">Tareas</a>
    <a href="/proyectos/" class="on">Proyectos</a>
    <a href="/contenido/">Contenido</a>
  </div>
  <div id="body"></div>
</div>
<div id="modalHost"></div>

<script>
(function () {
  var URL_SB = 'https://hwisrkincpkkdqrxuoch.supabase.co';
  var KEY = 'sb_publishable_TnJBE9EIVVra1x22ilN25Q_qgfMG1EC';
  var sb = window.supabase.createClient(URL_SB, KEY);
  var $ = function (i) { return document.getElementById(i); };

  var me = null, cuenta = null, proyectos = [], actual = null, resumenPct = {};
  var areas = [], tareas = [], bitacora = [], pestana = 'tareas', bloqueo = null;
  var arrastreId = null, arrastreTabla = null, logAbierto = null, areasAbiertas = {}, tareaAbierta = null;

  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function msg(elm, t, k) { elm.innerHTML = t ? '<div class="msg ' + k + '">' + t + '</div>' : ''; }
  function hoy() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  var MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
  var MESES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  function fechaCorta(iso) { var p = String(iso || '').slice(0, 10).split('-'); if (p.length !== 3) return iso || ''; var t = parseInt(p[2], 10) + ' ' + (MESES[parseInt(p[1], 10) - 1] || ''); if (String(new Date().getFullYear()) !== p[0]) t += ' ' + p[0]; return t; }
  function fechaLarga(iso) { var p = String(iso || '').slice(0, 10).split('-'); if (p.length !== 3) return ''; return parseInt(p[2], 10) + ' de ' + MESES_L[parseInt(p[1], 10) - 1] + ' de ' + p[0]; }

  // ---------------- Estados del proyecto ----------------
  var ESTADOS = [
    { v: 'active', lbl: 'Activo', dot: '#2ee6a6' },
    { v: 'paused', lbl: 'Pausado', dot: '#ff9f43' },
    { v: 'done', lbl: 'Finalizado', dot: '#35e5ff' },
    { v: 'inactive', lbl: 'Inactivo', dot: '#948bc4' },
    { v: 'archived', lbl: 'Archivado', dot: '#6b6688' }
  ];
  // Mapea estados antiguos a la nueva lista, sin romper filas guardadas.
  var ALIAS_EST = { on_hold: 'paused', pending: 'active', cancelled: 'inactive' };
  function estNorm(v) { return ALIAS_EST[v] || v; }
  function estadoInfo(v) { v = estNorm(v); for (var i = 0; i < ESTADOS.length; i++) if (ESTADOS[i].v === v) return ESTADOS[i]; return ESTADOS[0]; }
  function pillEstado(v) { var e = estadoInfo(v), s = el('span', 'pstatus'); var d = el('span', 'pstatus-dot'); d.style.background = e.dot; s.appendChild(d); s.appendChild(document.createTextNode(e.lbl)); return s; }

  // ---------------- Menú (⋮) ----------------
  document.addEventListener('click', function () { document.querySelectorAll('.menu-pop').forEach(function (p) { p.classList.add('hidden'); }); });
  function menuAcciones(items, mini) {
    var wrap = el('div', 'menu-wrap');
    var btn = el('button', 'menu-btn' + (mini ? ' mini' : ''), '⋮'); btn.title = 'Acciones'; btn.type = 'button';
    var pop = el('div', 'menu-pop hidden');
    items.forEach(function (it) { if (!it) return; var b = el('button', it.danger ? 'danger' : '', it.label); b.type = 'button'; if (it.disabled) b.disabled = true; b.onclick = function (ev) { ev.preventDefault(); ev.stopPropagation(); pop.classList.add('hidden'); it.onClick(); }; pop.appendChild(b); });
    btn.onclick = function (ev) { ev.preventDefault(); ev.stopPropagation(); var abrir = pop.classList.contains('hidden'); document.querySelectorAll('.menu-pop').forEach(function (p) { p.classList.add('hidden'); }); if (abrir) pop.classList.remove('hidden'); };
    wrap.appendChild(btn); wrap.appendChild(pop); return wrap;
  }

  // ---------------- Acceso ----------------
  $('loginBtn').addEventListener('click', entrar);
  $('password').addEventListener('keydown', function (e) { if (e.key === 'Enter') entrar(); });
  $('outBtn').addEventListener('click', function () { sb.auth.signOut(); });
  async function entrar() {
    var e = $('email').value.trim(), p = $('password').value;
    if (!e || !p) { msg($('loginMsg'), 'Completa correo y contraseña.', 'error'); return; }
    $('loginBtn').disabled = true; msg($('loginMsg'), '', '');
    var r = await sb.auth.signInWithPassword({ email: e, password: p });
    $('loginBtn').disabled = false; if (r.error) msg($('loginMsg'), r.error.message, 'error');
  }
  sb.auth.onAuthStateChange(async function (_ev, s) {
    if (s && s.user) {
      var a = await sb.rpc('is_active_user');
      if (a.error || !a.data) { bloqueo = 'Tu cuenta está desactivada. Contacta al administrador.'; await sb.auth.signOut(); return; }
      me = s.user;
      var pr = await sb.from('profiles').select('account_id').eq('id', me.id).maybeSingle();
      cuenta = pr.data ? pr.data.account_id : null;
      $('whoami').textContent = me.email; $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden');
      abrirDesdeURL();
    } else { me = null; $('appView').classList.add('hidden'); $('loginView').classList.remove('hidden'); if (bloqueo) { msg($('loginMsg'), bloqueo, 'error'); bloqueo = null; } }
  });

  // ---------------- Avance por hojas (sin doble conteo) ----------------
  function porPos(a, b) { return (a.position || 0) - (b.position || 0); }
  function hijas(id) { return tareas.filter(function (t) { return t.parent_id === id; }).sort(porPos); }
  function raizFase(areaId) { return tareas.filter(function (t) { return !t.parent_id && (areaId ? t.area_id === areaId : !t.area_id); }).sort(porPos); }
  function hojasDe(t) { var h = hijas(t.id); if (!h.length) return [t]; var out = []; h.forEach(function (c) { out = out.concat(hojasDe(c)); }); return out; }
  function pctNodo(t) { var L = hojasDe(t); var d = L.filter(function (x) { return x.status === 'done'; }).length; return { done: d, total: L.length, pct: L.length ? d / L.length : 0 }; }
  function pctFase(areaId) { var r = raizFase(areaId); var L = []; r.forEach(function (t) { L = L.concat(hojasDe(t)); }); var d = L.filter(function (x) { return x.status === 'done'; }).length; return { done: d, total: L.length, pct: L.length ? d / L.length : 0 }; }
  function todasLasHojas() { return tareas.filter(function (t) { return !hijas(t.id).length; }); }
  function pctProyecto() { var L = todasLasHojas(); var d = L.filter(function (x) { return x.status === 'done'; }).length; return { done: d, total: L.length, pct: L.length ? d / L.length : 0 }; }
  function estadoNodo(t) {
    var h = hijas(t.id); if (!h.length) return t.status;
    var L = hojasDe(t); var d = L.filter(function (x) { return x.status === 'done'; }).length;
    if (L.length && d === L.length) return 'done';
    if (d > 0 || L.some(function (x) { return x.status === 'in_progress'; })) return 'in_progress';
    return 'pending';
  }
  function iconoEstado(st) { return st === 'done' ? '✓' : st === 'in_progress' ? '◐' : st === 'paused' ? '—' : '○'; }
  function claseEstado(st) { return st === 'done' ? 'done' : st === 'in_progress' ? 'prog' : st === 'paused' ? 'paused' : ''; }

  // ---------------- Acordeón de fases ----------------
  function claveAreas() { return 'fasesAbiertas_' + (actual ? actual.id : ''); }
  function cargarAreasAbiertas() { try { areasAbiertas = JSON.parse(localStorage.getItem(claveAreas()) || '{}') || {}; } catch (_) { areasAbiertas = {}; } }
  function guardarAreasAbiertas() { try { localStorage.setItem(claveAreas(), JSON.stringify(areasAbiertas)); } catch (_) {} }
  function abrirArea(key) { areasAbiertas[key] = true; guardarAreasAbiertas(); }
  function toggleArea(key) { if (areasAbiertas[key]) delete areasAbiertas[key]; else areasAbiertas[key] = true; guardarAreasAbiertas(); pintar(); }

  // ---------------- Navegación ----------------
  function abrirDesdeURL() { var id = new URLSearchParams(location.search).get('p'); if (id) verProyecto(id); else listaProyectos(); }
  window.addEventListener('popstate', abrirDesdeURL);

  async function guardar(t, campos) { Object.assign(t, campos); var r = await sb.from('project_tasks').update(campos).eq('id', t.id); if (r.error) alert('No se pudo guardar: ' + r.error.message); tocar(); }
  // "Tocar" el proyecto: actualiza updated_at para que la vista pública muestre la última actualización.
  function tocar() { if (actual) { actual.updated_at = new Date().toISOString(); sb.from('projects').update({ updated_at: actual.updated_at }).eq('id', actual.id); } }

  // ---------------- Lista de proyectos (tarjetas) ----------------
  async function listaProyectos() {
    actual = null;
