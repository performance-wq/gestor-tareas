<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organizadísimos</title>
<meta name="description" content="Organizadísimos — organiza y ejecuta los proyectos de tu equipo: tareas, subtareas y seguimiento en un solo lugar.">
<meta name="theme-color" content="#07050f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23140b24'/%3E%3Cpath d='M17 33.5l10 10L47 22' fill='none' stroke='%23b06bff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #07050f;
    --bg2: #0d0820;
    --panel: rgba(255,255,255,0.045);
    --panel-strong: rgba(255,255,255,0.08);
    --line: rgba(168,120,255,0.22);
    --text: #ece7ff;
    --muted: #948bc4;
    --accent: #b06bff;
    --accent2: #35e5ff;
    --danger: #ff4d6d;
    --warn: #ff9f43;
    --ok: #2ee6a6;
    --overdue: #ff2fd0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }
  body::before, body::after {
    content: '';
    position: fixed;
    width: 60vw;
    height: 60vw;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.22;
    z-index: 0;
    pointer-events: none;
    animation: drift 22s ease-in-out infinite alternate;
  }
  body::before { background: var(--accent); top: -20%; left: -15%; }
  body::after { background: var(--accent2); bottom: -25%; right: -15%; animation-delay: -8s; }
  @keyframes drift {
    0% { transform: translate(0,0) scale(1); }
    100% { transform: translate(6%, 4%) scale(1.15); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .app, #authScreen { position: relative; z-index: 1; }
  .app {
    width: 100%;
    max-width: 1100px;
    padding: 32px 24px 80px;
    display: none;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    gap: 10px;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    margin: 0;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 0.3px;
  }
  .user-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    color: var(--muted);
    flex-wrap: wrap;
    min-width: 0;
    max-width: 100%;
  }
  .user-bar #userEmail {
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .btn {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12.5px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.18s ease;
    backdrop-filter: blur(6px);
  }
  .btn:hover { border-color: var(--accent2); box-shadow: 0 0 12px rgba(53,229,255,0.25); transform: translateY(-1px); }
  .btn.danger { color: var(--danger); border-color: rgba(255,77,109,0.4); }
  .btn.danger:hover { box-shadow: 0 0 12px rgba(255,77,109,0.3); }
  .btn.primary { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #07050f; font-weight: 700; border: none; }
  .btn.primary:hover { box-shadow: 0 0 18px rgba(176,107,255,0.5); }

  .projectbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 18px 0 14px;
  }
  .board-name-input {
    font-size: 17px;
    font-weight: 700;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    padding: 5px 8px;
    max-width: 260px;
    font-family: inherit;
  }
  .board-name-input:hover { background: var(--panel); }
  .board-name-input:focus { border-color: var(--accent2); outline: none; background: var(--panel-strong); }
  select.board-picker {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 13px;
    background: var(--panel);
    color: var(--text);
    max-width: 200px;
  }
  select.board-picker option { background: #12102a; color: var(--text); }

  .share-panel {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 13px;
    display: none;
    background: var(--panel);
    animation: fadeInUp 0.2s ease;
  }
  .share-panel.open { display: block; }
  .share-panel h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .member-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .member-row:last-of-type { border-bottom: none; }
  .member-tag { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .member-rm { color: var(--danger); cursor: pointer; font-size: 12px; background: none; border: none; }
  .add-member-row { display: flex; gap: 6px; margin-top: 10px; }
  .add-member-row input {
    flex: 1; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 13px; font-family: inherit; background: var(--panel-strong); color: var(--text);
  }
  .add-member-row button { padding: 7px 12px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 13px; cursor: pointer; }

  .notify-banner {
    background: linear-gradient(90deg, rgba(255,159,67,0.15), rgba(255,47,208,0.12));
    color: #ffd7a8;
    border: 1px solid rgba(255,159,67,0.4);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 16px;
    animation: fadeInUp 0.25s ease;
  }

  .save-status { font-size: 12px; color: var(--muted); }

  /* ---------- Matrix ---------- */
  .matrix-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media (max-width: 720px) { .matrix-grid { grid-template-columns: 1fr; } }
  .quadrant {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 10px;
    min-height: 110px;
    background: var(--panel);
    display: flex;
    flex-direction: column;
    transition: border-color 0.2s ease;
    position: relative;
  }
  .quadrant.drag-over { border-color: var(--accent2); }
  .quadrant h4 {
    margin: 0 0 6px;
    font-size: 11px;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.7px;
  }
  .qlist { flex: 1; display: flex; flex-direction: column; min-height: 28px; }
  .qlist:empty::after {
    content: 'Arrastra tareas aquí';
    color: var(--muted);
    font-size: 11.5px;
    opacity: 0.45;
    padding: 6px 0;
  }
  .qadd {
    margin-top: 6px;
    border: 1px dashed var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 7px;
    padding: 4px;
    font-size: 12px;
    cursor: pointer;
    transition: color 0.18s ease, border-color 0.18s ease;
  }
  .qadd:hover { border-color: var(--accent2); color: var(--accent2); }

  /* ---------- Tarea raíz: fila de lista, no tarjeta ---------- */
  /* Plana y separada por una línea fina: la densidad manda y la jerarquía
     se lee por la indentación, no por cajas anidadas. */
  .card {
    border-bottom: 1px solid var(--line);
    padding: 1px 0;
    cursor: grab;
  }
  .card:last-child { border-bottom: none; }
  .card.dragging { opacity: 0.35; cursor: grabbing; }
  .tag-chip {
    font-size: 10px; border-radius: 5px; padding: 0 5px;
    background: rgba(176,107,255,0.15); color: #d9bcff; border: 1px solid rgba(176,107,255,0.3);
  }
  .due-badge {
    font-size: 10px; border-radius: 5px; padding: 0 5px; font-weight: 600;
    border: 1px solid transparent;
  }
  .due-badge.d-today { background: rgba(255,77,109,0.16); color: #ff8fa3; }
  .due-badge.d-soon { background: rgba(255,159,67,0.16); color: #ffc48a; }
  .due-badge.d-later { color: var(--muted); }
  .due-badge.d-overdue { background: rgba(255,77,109,0.28); color: #ffb3c6; }

  /* ---------- Árbol de tareas: lista densa, no explorador de archivos ---------- */
  /* Todas las medidas van en múltiplos pequeños: la fila es la unidad de
     densidad y nada debe empujarla más allá de ~19px de alto. */
  .tnode.removing { animation: nodeOut 0.17s ease forwards; }
  @keyframes nodeOut { to { opacity: 0; transform: translateX(8px) scale(0.96); } }

  /* Fila de cada nodo */
  .tnode-row { display: flex; align-items: flex-start; gap: 4px; border-radius: 4px; padding: 0 2px; transition: background 0.12s ease; }
  .tnode-row:hover { background: rgba(255,255,255,0.035); }
  .tnode-row.done > .tnode-text { text-decoration: line-through; color: var(--muted); }

  /* Triángulo expandir/contraer: ▸ que gira a ▾ */
  .tnode-chevron {
    flex: 0 0 auto; width: 12px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--muted); font-size: 10px; user-select: none;
    transition: transform 0.18s ease, color 0.12s ease;
  }
  .tnode-chevron:hover { color: var(--text); }
  .tnode-chevron.expanded { transform: rotate(90deg); }
  .tnode-chevron.hidden-chevron { visibility: hidden; cursor: default; }

  /* Casilla ☐ / ✓ — es el único indicador de estado que necesita una tarea */
  .tnode-check {
    flex: 0 0 13px; width: 13px; height: 13px; margin-top: 2.5px;
    border: 1px solid var(--line); border-radius: 3px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: #07050f; user-select: none; transition: background 0.12s ease, border-color 0.12s ease;
  }
  .tnode-check:hover { border-color: var(--accent2); }
  .tnode-check.checked { background: var(--accent); border-color: var(--accent); }

  /* Texto editable: la raíz pesa un poco más, el resto es todo igual */
  .tnode-text {
    flex: 1; min-width: 0; outline: none; white-space: pre-wrap; word-break: break-word; color: var(--text);
    font-size: 12.5px; line-height: 18px;
  }
  .lvl-1 > .tnode-row > .tnode-text { font-weight: 600; }
  .tnode-text:empty::before { content: attr(data-placeholder); color: var(--muted); }

  /* Botón agregar subtarea: aparece en hover */
  .tnode-add {
    flex: 0 0 auto; width: 16px; height: 18px;
    border: none; background: none; color: var(--muted);
    cursor: pointer; font-size: 13px; line-height: 1; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.12s ease, color 0.12s ease;
  }
  .tnode-row:hover .tnode-add { opacity: 0.8; }
  .tnode-add:hover { opacity: 1; color: var(--accent2); }

  /* Menú ⋯ */
  .tnode-menu {
    flex: 0 0 auto; font-size: 12px; color: var(--muted); cursor: pointer;
    background: none; border: none; padding: 0 2px; height: 18px; border-radius: 4px;
    opacity: 0; transition: opacity 0.12s ease, color 0.12s ease;
  }
  .tnode-row:hover .tnode-menu { opacity: 0.8; }
  .tnode-menu:hover { color: var(--accent2); opacity: 1; }

  /* Metadatos en la propia fila: etiquetas, fecha y progreso */
  .tnode-meta { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; height: 18px; }
  .progress-count { font-size: 10px; color: var(--muted); white-space: nowrap; font-weight: 600; }
  .progress-count.complete { color: var(--ok, #2ee6a6); }

  /* Hijos: la jerarquía se lee por la indentación y la guía vertical */
  .tnode-children { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.2s ease; }
  .tnode-children.expanded { grid-template-rows: 1fr; }
  .tnode-children-inner { overflow: hidden; margin-left: 11px; padding-left: 8px; border-left: 1px solid var(--line); }

  /* ---------- Drag & drop del árbol ---------- */
  .tnode-grip {
    flex: 0 0 auto; width: 11px; height: 18px; margin-left: -2px;
    display: flex; align-items: center; justify-content: center;
    cursor: grab; color: var(--muted); font-size: 11px; line-height: 1;
    opacity: 0; transition: opacity 0.12s ease, color 0.12s ease; user-select: none;
  }
  .tnode-row:hover .tnode-grip { opacity: 0.55; }
  .tnode-grip:hover { opacity: 1; color: var(--accent2); }
  .tnode-grip:active { cursor: grabbing; }
  .tnode.dragging { opacity: 0.4; }

  .tnode-row { position: relative; }
  .tnode-row.drop-before::before,
  .tnode-row.drop-after::after {
    content: ''; position: absolute; left: 4px; right: 4px; height: 2px; z-index: 3;
    background: var(--accent2); border-radius: 2px; box-shadow: 0 0 6px var(--accent2);
  }
  .tnode-row.drop-before::before { top: -3px; }
  .tnode-row.drop-after::after { bottom: -3px; }
  .tnode-row.drop-inside { background: rgba(53,229,255,0.14); box-shadow: inset 0 0 0 1px var(--accent2); }

  /* ---------- Selector de etiquetas (picker) ---------- */
  .tag-add-btn {
    font-size: 11px; border-radius: 8px; padding: 2px 8px; cursor: pointer;
    background: transparent; color: var(--muted); border: 1px dashed var(--line);
    transition: all 0.15s ease;
  }
  .tag-add-btn:hover { color: var(--accent2); border-color: var(--accent2); }
  .tag-picker {
    margin-top: 8px; border: 1px solid var(--line); border-radius: 10px;
    padding: 8px; background: rgba(0,0,0,0.35); animation: fadeInUp 0.15s ease;
    max-height: 220px; overflow-y: auto;
  }
  .tag-opt {
    display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 7px;
    cursor: pointer; font-size: 12.5px; transition: background 0.12s ease;
  }
  .tag-opt:hover { background: rgba(255,255,255,0.05); }
  .tag-swatch { width: 11px; height: 11px; border-radius: 3px; flex: 0 0 auto; }
  .tag-opt-name { flex: 1; }
  .tag-opt-check { color: var(--accent2); font-size: 12px; }
  .tag-picker-new { display: flex; gap: 6px; margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line); }
  .tag-picker-new input {
    flex: 1; padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px;
    font-size: 12px; font-family: inherit; background: var(--panel-strong); color: var(--text);
  }
  .meta-tag-chip button { border: none; background: none; cursor: pointer; font-size: 12px; padding: 0 0 0 3px; color: inherit; }

  /* ---------- Administrador de etiquetas ---------- */
  .tags-panel {
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    margin-bottom: 16px; font-size: 13px; display: none; background: var(--panel);
    animation: fadeInUp 0.2s ease;
  }
  .tags-panel.open { display: block; }
  .tags-panel h3 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .tags-empty { color: var(--muted); font-size: 12.5px; }
  .tagmgr-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tagmgr-row:last-child { border-bottom: none; }
  .tagmgr-row input[type="color"] { width: 26px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; flex: 0 0 auto; }
  .tagmgr-row input[type="text"] { flex: 1; min-width: 110px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; font-size: 12.5px; font-family: inherit; background: var(--panel-strong); color: var(--text); }
  .tagmgr-merge { padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; font-size: 12px; background: var(--panel); color: var(--muted); font-family: inherit; }
  .tagmgr-merge option { background: #12102a; color: var(--text); }
  .tagmgr-del { color: var(--danger); background: none; border: 1px solid rgba(255,77,109,0.4); border-radius: 7px; padding: 5px 9px; font-size: 12px; cursor: pointer; }
  .tagmgr-del:hover { background: rgba(255,77,109,0.12); }

  .meta-panel {
    display: none;
    margin-top: 8px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(0,0,0,0.25);
    font-size: 12px;
    animation: fadeInUp 0.18s ease;
  }
  .meta-panel.open { display: block; }
  .meta-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .meta-row label { color: var(--muted); min-width: 50px; }
  .meta-row input[type="date"], .meta-row input[type="text"] {
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px;
    font-family: inherit; font-size: 12px; background: var(--panel-strong); color: var(--text);
  }
  .meta-row input[type="text"] { flex: 1; min-width: 90px; }
  .meta-tags { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }
  .meta-tag-chip { background: rgba(176,107,255,0.18); color: #d9bcff; border-radius: 8px; padding: 2px 6px 2px 8px; display: inline-flex; align-items: center; gap: 4px; font-size: 11px; }
  .meta-tag-chip button { border: none; background: none; color: #d9bcff; cursor: pointer; font-size: 12px; padding: 0; }
  .meta-delete { color: var(--danger); background: none; border: 1px solid rgba(255,77,109,0.4); border-radius: 6px; padding: 4px 9px; font-size: 11.5px; cursor: pointer; }
  .meta-delete:hover { background: rgba(255,77,109,0.12); }

  /* ---------- Vista de una sola columna ---------- */
  .list-view { display: block; width: 100%; }
  .pending-list { display: block; }
  .list-empty { color: var(--muted); font-size: 12.5px; opacity: 0.7; padding: 14px 2px; }

  /* Marca / tarea principal: un poco de aire arriba para separar frentes. */
  .tnode.lvl-1 { margin-top: 4px; }
  .tnode.lvl-1 > .brand-row { padding-top: 2px; padding-bottom: 2px; }
  .tnode-text.is-grouper { cursor: pointer; }
  .tnode-text.is-grouper.editing { cursor: text; outline: none; }
  .lvl-1 > .tnode-row > .tnode-text.is-grouper { text-transform: none; letter-spacing: 0.2px; }

  /* Responsable inline (a la derecha de la actividad) */
  .assignee-chip {
    font-size: 10.5px; border-radius: 6px; padding: 1px 7px; white-space: nowrap;
    background: rgba(53,229,255,0.12); color: #a7ecff; border: 1px solid rgba(53,229,255,0.28);
    cursor: pointer; transition: all 0.14s ease;
  }
  .assignee-chip:hover { border-color: var(--accent2); color: #d6f7ff; }
  .assignee-chip.empty { background: transparent; color: var(--muted); border: 1px dashed var(--line); opacity: 0; }
  .tnode-row:hover .assignee-chip.empty { opacity: 0.7; }
  .assignee-chip.empty:hover { opacity: 1; }

  /* Conteo de pendientes en las marcas */
  .group-count { font-size: 10.5px; color: var(--muted); white-space: nowrap; font-weight: 600; }
  .group-count.complete { color: var(--ok, #2ee6a6); font-weight: 500; opacity: 0.8; }

  /* Botón nueva tarea principal */
  .addroot-btn {
    margin-top: 12px; width: 100%; text-align: left;
    border: 1px dashed var(--line); background: transparent; color: var(--muted);
    border-radius: 9px; padding: 9px 12px; font-size: 13px; font-family: inherit; cursor: pointer;
    transition: color 0.16s ease, border-color 0.16s ease;
  }
  .addroot-btn:hover { border-color: var(--accent2); color: var(--accent2); }

  /* ---------- Historial de completadas ---------- */
  .list-sep { height: 1px; background: var(--line); margin: 22px 0 4px; }
  .completed-section { margin-top: 6px; }
  .completed-head {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 8px 4px; border-radius: 8px; user-select: none; transition: background 0.12s ease;
  }
  .completed-head:hover { background: rgba(255,255,255,0.035); }
  .completed-chev { color: var(--muted); font-size: 11px; transition: transform 0.18s ease; }
  .completed-chev.open { transform: rotate(90deg); }
  .completed-title { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.7px; color: var(--muted); }
  .completed-count { font-size: 12px; color: var(--muted); font-weight: 600; }
  .completed-body { padding: 6px 2px 2px; animation: fadeInUp 0.18s ease; }
  .completed-empty { color: var(--muted); font-size: 12.5px; opacity: 0.7; padding: 8px 2px; }

  .completed-item { display: flex; align-items: flex-start; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .completed-item:last-child { border-bottom: none; }
  .completed-restore {
    flex: 0 0 15px; width: 15px; height: 15px; margin-top: 1px; border-radius: 3px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    background: var(--ok, #2ee6a6); color: #07050f; font-size: 10px; border: 1px solid var(--ok, #2ee6a6);
    transition: filter 0.14s ease;
  }

<div id="authScreen">

<script>
(function () {
  // ---- Supabase setup ----
  const SUPABASE_URL = 'https://hwisrkincpkkdqrxuoch.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_TnJBE9EIVVra1x22ilN25Q_qgfMG1EC';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const authScreen = document.getElementById('authScreen');
  const appScreen = document.getElementById('appScreen');
  const authEmail = document.getElementById('authEmail');
  const authPassword = document.getElementById('authPassword');
  const authSubmit = document.getElementById('authSubmit');
  const authMsg = document.getElementById('authMsg');
  const authSub = document.getElementById('authSub');
  const userEmailEl = document.getElementById('userEmail');
  const signOutBtn = document.getElementById('signOutBtn');
  const saveStatusEl = document.getElementById('saveStatus');
  const boardNameInput = document.getElementById('boardNameInput');
  const boardPicker = document.getElementById('boardPicker');
  const newBoardBtn = document.getElementById('newBoardBtn');
  const shareBtn = document.getElementById('shareBtn');
  const sharePanel = document.getElementById('sharePanel');
  const memberListEl = document.getElementById('memberList');
  const memberEmailInput = document.getElementById('memberEmailInput');
  const addMemberBtn = document.getElementById('addMemberBtn');
  const deleteBoardBtn = document.getElementById('deleteBoardBtn');
  const matrixViewEl = document.getElementById('matrixView');
  const dashboardViewEl = document.getElementById('dashboardView');
  const notifyBanner = document.getElementById('notifyBanner');
  const countEl = document.getElementById('count');
  const tagsBtn = document.getElementById('tagsBtn');
  const tagsPanel = document.getElementById('tagsPanel');
  const tagsListEl = document.getElementById('tagsList');

  let currentUser = null;
  let boards = [];
  let currentBoard = null;
  let members = [];
  let tagCatalog = [];
  let saveTimer = null;
  let openMetaId = null;
  let openTagPickerId = null;
  let dragId = null;

  // Modelo relacional (task_items): filas planas + índices por padre.
  let items = [];        // filas de task_items del board actual
  let byId = {};         // id -> fila
  let kidsOf = {};       // parent_id ('__root' si raíz) -> [filas ordenadas]
  let isAdmin = false;   // puede administrar el board (dueño o admin de proyecto)
  let myRole = 'viewer'; // 'owner' | 'admin' | 'member' | 'viewer'
  let view = 'list';     // 'list' | 'dashboard'
  let openHistoryId = null;

  // ---------------- UI: toasts y modales reutilizables ----------------
  function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function toast(msg, type) {
    let host = document.getElementById('toastHost');
    if (!host) { host = el('div'); host.id = 'toastHost'; host.className = 'toast-host'; document.body.appendChild(host); }
    const t = el('div', 'toast ' + (type || 'ok'), msg);
    host.appendChild(t);
    setTimeout(function () { t.classList.add('out'); setTimeout(function () { t.remove(); }, 250); }, 2600);
  }
  // Modal de confirmación. opts: {title, message, okText, danger, onOk}
  function confirmDialog(opts) {
    const ov = el('div', 'uxo');
    const m = el('div', 'uxm');
    m.appendChild(el('h3', 'uxm-title', opts.title || '¿Confirmar?'));
    if (opts.message) { const p = el('div', 'uxm-msg'); p.innerHTML = opts.message; m.appendChild(p); }
    const acts = el('div', 'uxm-acts');
    const cancel = el('button', 'uxbtn', 'Cancelar');
    cancel.addEventListener('click', function () { ov.remove(); });
    const ok = el('button', 'uxbtn ' + (opts.danger ? 'danger' : 'primary'), opts.okText || 'Confirmar');
    ok.addEventListener('click', async function () { ok.disabled = true; try { await opts.onOk(); } finally { ov.remove(); } });
    acts.appendChild(cancel); acts.appendChild(ok);
    m.appendChild(acts); ov.appendChild(m);
    ov.addEventListener('click', function (e) { if (e.target === ov) ov.remove(); });
    document.body.appendChild(ov);
    setTimeout(function () { ok.focus(); }, 0);
    return ov;
  }
  // Modal de formulario. opts: {title, fields:[{key,label,type,value,options,placeholder}], okText, onSave}
  // Los cambios NO se aplican al escribir; solo al pulsar "Guardar cambios".
  function formModal(opts) {
    const ov = el('div', 'uxo');
    const m = el('div', 'uxm uxm-form');
    m.appendChild(el('h3', 'uxm-title', opts.title || 'Editar'));
    const inputs = {};
    (opts.fields || []).forEach(function (f) {
      const row = el('div', 'uxf');
      row.appendChild(el('label', null, f.label));
      let inp;
      if (f.type === 'select') {
        inp = el('select');
        (f.options || []).forEach(function (o) { const op = el('option', null, o.label); op.value = o.value; if (String(o.value) === String(f.value == null ? '' : f.value)) op.selected = true; inp.appendChild(op); });
      } else if (f.type === 'textarea') {
        inp = el('textarea'); inp.rows = 3; inp.value = f.value || '';
      } else {
        inp = el('input'); inp.type = f.type || 'text'; inp.value = f.value == null ? '' : f.value;
      }
      if (f.placeholder) inp.placeholder = f.placeholder;
      row.appendChild(inp); m.appendChild(row); inputs[f.key] = inp;
    });
    const acts = el('div', 'uxm-acts');
    const cancel = el('button', 'uxbtn', 'Cancelar');
    cancel.addEventListener('click', function () { ov.remove(); });
    const save = el('button', 'uxbtn primary', opts.okText || 'Guardar cambios');
    save.addEventListener('click', async function () {
      const vals = {}; Object.keys(inputs).forEach(function (k) { vals[k] = inputs[k].value; });
      save.disabled = true;
      try { const ok = await opts.onSave(vals); if (ok !== false) ov.remove(); else save.disabled = false; }
      catch (e) { save.disabled = false; toast('No se pudo guardar.', 'err'); }
    });
    acts.appendChild(cancel); acts.appendChild(save);
    m.appendChild(acts); ov.appendChild(m);
    ov.addEventListener('click', function (e) { if (e.target === ov) ov.remove(); });
    document.body.appendChild(ov);
    setTimeout(function () { const first = m.querySelector('input,textarea,select'); if (first) first.focus(); }, 0);
    return ov;
  }
  // Opciones de responsable para los selectores (miembros del board).
  function assigneeOptions(current) {
    const opts = [{ value: '', label: '— Sin asignar —' }];
    members.forEach(function (mm) { opts.push({ value: mm.id, label: memberName(mm.id) + (mm.isOwner ? ' (dueño)' : '') }); });
    return opts;
  }

  // ---------------- Auth ----------------

  // Acceso privado: no existe auto-registro. Las cuentas se crean únicamente
  // desde el panel de administración (/admin), y el registro está además
  // deshabilitado en el servidor de Supabase.
  function setAuthMode() {
    authMsg.innerHTML = '';
    authSub.textContent = 'Inicia sesión para acceder a tus tareas.';
    authSubmit.textContent = 'Iniciar sesión';
  }

  function showAuthMsg(text, type) {
    authMsg.innerHTML = '<div class="auth-msg ' + type + '">' + text + '</div>';
  }

  authSubmit.addEventListener('click', async function () {
    const email = authEmail.value.trim();
    const password = authPassword.value;
    if (!email || !password) { showAuthMsg('Completa correo y contraseña.', 'error'); return; }
    authSubmit.disabled = true;
    authMsg.innerHTML = '';
    try {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    } catch (err) {
      showAuthMsg(err.message || 'Algo salió mal.', 'error');
    } finally {
      authSubmit.disabled = false;
    }
  });

  signOutBtn.addEventListener('click', async function () { await sb.auth.signOut(); });

  // Mensaje que debe sobrevivir al cierre de sesión automático (la pantalla de
  // acceso se reinicia y borraría el aviso).
  let mensajeBloqueo = null;

  sb.auth.onAuthStateChange(async function (event, session) {
    if (session && session.user) {
      // Autenticarse no basta: la cuenta del usuario Y la de su empresa deben
      // estar activas. is_active_user() comprueba ambas en el servidor.
      const { data: activo, error: errActivo } = await sb.rpc('is_active_user');
      if (errActivo || !activo) {
        mensajeBloqueo = 'Tu cuenta está desactivada. Contacta al administrador.';
        await sb.auth.signOut();
        return;
      }
      currentUser = session.user;
      authScreen.classList.add('hidden');
      appScreen.style.display = 'block';
      userEmailEl.textContent = currentUser.email;
      bootstrap();

      currentUser = null;
      appScreen.style.display = 'none';
      authScreen.classList.remove('hidden');
      setAuthMode('signin');
      if (mensajeBloqueo) { showAuthMsg(mensajeBloqueo, 'error'); mensajeBloqueo = null; }
    }

  // ---------------- Boards / projects ----------------

  async function bootstrap() {
    await loadBoardsList();
    const lastId = localStorage.getItem('lastBoard_' + currentUser.id);
    const found = boards.find(function (b) { return b.id === lastId; });
    await switchBoard(found ? found.id : boards[0].id);
  }

  async function loadBoardsList() {
    const { data, error } = await sb.from('boards').select('id, name, owner_id').order('name');
    if (error) { saveStatusEl.textContent = 'Error: ' + error.message; boards = []; return; }
    boards = data || [];
    if (!boards.length) {
      const { data: newBoard, error: insErr } = await sb
        .from('boards')
        .insert({ owner_id: currentUser.id, name: 'Mis tareas', data: [] })
        .select('id, name, owner_id')
        .single();
      if (!insErr && newBoard) boards = [newBoard];

  function renderBoardPicker() {
    boardPicker.innerHTML = '';
    boards.forEach(function (b) {
      const opt = document.createElement('option');
      opt.value = b.id;
      opt.textContent = b.name + (b.owner_id !== currentUser.id ? ' (compartido)' : '');

      boardPicker.appendChild(opt);
    });

    const { data, error } = await sb.from('boards')
      .insert({ owner_id: currentUser.id, name: 'Nuevo proyecto', data: [] })

    currentBoard.name = newName;
    const found = boards.find(function (b) { return b.id === currentBoard.id; });

    await sb.from('boards').update({ name: newName }).eq('id', currentBoard.id);

  deleteBoardBtn.addEventListener('click', async function () {
    if (!currentBoard) return;
    if (boards.length <= 1) { alert('No puedes eliminar tu único proyecto. Crea otro primero.'); return; }
    const ok = confirm('¿Eliminar "' + currentBoard.name + '"? Esto borra todas sus tareas permanentemente.');
    if (!ok) return;
    const idToDelete = currentBoard.id;
    const { error } = await sb.from('boards').delete().eq('id', idToDelete);

  async function switchBoard(boardId) {
    const { data, error } = await sb.from('boards').select('*').eq('id', boardId).single();
    if (error || !data) { saveStatusEl.textContent = 'Error al cargar proyecto.'; return; }
    currentBoard = data;
    localStorage.setItem('lastBoard_' + currentUser.id, currentBoard.id);
    loadCollapse();
    // Rol: admin = dueño del board; los miembros compartidos son operativos.
    isAdmin = currentBoard.owner_id === currentUser.id;
    // El catálogo de etiquetas sigue viviendo en boards.data.tags; las TAREAS
    // ahora son relacionales (task_items), no el blob.
    const raw = currentBoard.data;
    const loadedTags = (raw && typeof raw === 'object' && Array.isArray(raw.tags)) ? raw.tags : [];
    tagCatalog = normalizeTags(loadedTags);
    openTagPickerId = null; openMetaId = null; openHistoryId = null;
    boardNameInput.value = currentBoard.name;
    boardNameInput.disabled = !isAdmin;
    renderBoardPicker();
    await loadMembers();
    await loadItems();

    render();

  // ---------------- Carga relacional de tareas ----------------
  async function loadItems() {
    items = []; byId = {}; kidsOf = {};
    if (!currentBoard) return;
    const { data, error } = await sb.from('task_items').select('*').eq('board_id', currentBoard.id).order('position');
    if (error) { saveStatusEl.textContent = 'Error al cargar tareas: ' + error.message; return; }
    items = data || [];
    indexItems();
  }
  function indexItems() {
    byId = {}; kidsOf = {};
    items.forEach(function (r) { byId[r.id] = r; });
    items.forEach(function (r) { const k = r.parent_id || '__root'; (kidsOf[k] = kidsOf[k] || []).push(r); });
    Object.keys(kidsOf).forEach(function (k) { kidsOf[k].sort(function (a, b) { return (a.position || 0) - (b.position || 0); }); });
  }
  function childrenOf(id) { return kidsOf[id || '__root'] || []; }
  function rootItems() { return kidsOf['__root'] || []; }
  function isLeaf(r) { return childrenOf(r.id).length === 0; }
  function flatItems() { return items.slice(); }

  // ---------------- Sharing / members ----------------

  async function loadMembers() {
    members = [];
    if (!currentBoard) return;
    const ownerId = currentBoard.owner_id;
    const { data: ownerProfile } = await sb.from('profiles').select('id, email, full_name').eq('id', ownerId).maybeSingle();
    if (ownerProfile) members.push({ id: ownerProfile.id, email: ownerProfile.email, full_name: ownerProfile.full_name, isOwner: true, role: 'owner' });
    const { data: memberRows } = await sb.from('board_members').select('user_id, role').eq('board_id', currentBoard.id);
    // Dedup: el dueño nunca se lista como miembro (evita el correo repetido), y
    // no se repite un mismo usuario aunque hubiera filas duplicadas.
    const seen = {}; members.forEach(function (m) { seen[m.id] = 1; });
    const rows = (memberRows || []).filter(function (r) { if (r.user_id === ownerId || seen[r.user_id]) return false; seen[r.user_id] = 1; return true; });
    const ids = rows.map(function (r) { return r.user_id; });
    if (ids.length) {
      const { data: profs } = await sb.from('profiles').select('id, email, full_name').in('id', ids);
      rows.forEach(function (r) {
        const p = (profs || []).find(function (x) { return x.id === r.user_id; }) || { id: r.user_id, email: '(desconocido)' };
        members.push({ id: p.id, email: p.email, full_name: p.full_name, isOwner: false, role: r.role || 'member' });
      });
    }
    // Rol del usuario actual en este board.
    const meM = members.find(function (m) { return m.id === currentUser.id; });
    myRole = (ownerId === currentUser.id) ? 'owner' : (meM ? meM.role : 'viewer');
    isAdmin = (myRole === 'owner' || myRole === 'admin');
  }
  function roleLabel(r) { return { owner: 'Dueño', admin: 'Admin proyecto', member: 'Miembro', viewer: 'Solo lectura' }[r] || r; }
  // Nombre legible de un responsable (usuario real) o el nombre heredado (legacy).
  function memberName(id) {
    const m = members.find(function (x) { return x.id === id; });
    if (!m) return null;
    return (m.full_name && m.full_name.trim()) ? m.full_name.trim() : (m.email || '').split('@')[0];
  }
  function assigneeLabel(row) {
    if (row.assignee_id) { return memberName(row.assignee_id) || 'Usuario'; }
    if (row.assignee_legacy) { return row.assignee_legacy; }
    return null;
  }

  function ensureAddRoleSelect() {

    const sel = el('select', 'role-sel'); sel.id = 'newMemberRole';
    [['member', 'Miembro'], ['admin', 'Admin proyecto'], ['viewer', 'Solo lectura']].forEach(function (o) { const op = el('option', null, o[1]); op.value = o[0]; sel.appendChild(op); });
    addMemberBtn.parentElement.insertBefore(sel, addMemberBtn);
  }
  function renderSharePanel() {
    memberListEl.innerHTML = '';

    members.forEach(function (m) {
      const row = el('div', 'member-row');

        [['admin', 'Admin proyecto'], ['member', 'Miembro'], ['viewer', 'Solo lectura']].forEach(function (o) { const op = el('option', null, o[1]); op.value = o[0]; if (m.role === o[0]) op.selected = true; sel.appendChild(op); });
        sel.addEventListener('change', async function () {
          const { error } = await sb.rpc('board_set_member_role', { p_board: currentBoard.id, p_user: m.id, p_role: sel.value });
          if (error) { toast('No se pudo cambiar el rol.', 'err'); sel.value = m.role; return; }
          m.role = sel.value; toast('Permisos actualizados correctamente', 'ok');
        });
        row.appendChild(sel);
        const rm = el('button', 'member-rm', 'Quitar del proyecto');
        rm.addEventListener('click', function () {
          confirmDialog({ title: '¿Quitar del proyecto?', message: '¿Deseas quitar a <b>' + escapeHtml(m.email) + '</b> del proyecto? Su cuenta seguirá existiendo en la plataforma.', okText: 'Quitar del proyecto', danger: true, onOk: async function () {
            const { error } = await sb.rpc('board_remove_member', { p_board: currentBoard.id, p_user: m.id });
            if (error) { toast(error.message || 'No se pudo quitar.', 'err'); return; }
            await loadMembers(); renderSharePanel(); toast('Usuario retirado del proyecto correctamente', 'ok');
          } });
        });

  // ---------------- Administrador de etiquetas ----------------

      const empty = document.createElement('div');
      empty.className = 'tags-empty';
      empty.textContent = 'Aún no hay etiquetas. Se crean al agregar una etiqueta desde el menú ⋯ de cualquier tarea.';
      tagsListEl.appendChild(empty);
      return;
    }
    tagCatalog.forEach(function (t) {
      const row = document.createElement('div');
      row.className = 'tagmgr-row';

      const color = document.createElement('input');
      color.type = 'color';
      color.value = t.color;
      color.title = 'Color';
      color.addEventListener('change', function () { setTagColor(t.name, color.value); save(); render(); });

      const name = document.createElement('input');
      name.type = 'text';
      name.value = t.name;
      name.addEventListener('change', function () {
        const nv = name.value.trim();
        if (nv && nv !== t.name) { renameTag(t.name, nv); save(); render(); }
        else name.value = t.name;
      });

      const merge = document.createElement('select');
      merge.className = 'tagmgr-merge';
      const opt0 = document.createElement('option');
      opt0.value = '';
      opt0.textContent = 'Fusionar en…';
      merge.appendChild(opt0);
      tagCatalog.forEach(function (o) {
        if (o.name === t.name) return;
        const op = document.createElement('option');
        op.value = o.name;
        op.textContent = o.name;
        merge.appendChild(op);
      });
      merge.addEventListener('change', function () {
        if (merge.value) { mergeTag(t.name, merge.value); save(); render(); }
      });

      const del = document.createElement('button');
      del.className = 'tagmgr-del';
      del.textContent = 'Eliminar';
      del.addEventListener('click', function () { deleteTag(t.name); save(); render(); });

      row.appendChild(color);
      row.appendChild(name);
      row.appendChild(merge);
      row.appendChild(del);
      tagsListEl.appendChild(row);
    });

  // ---------------- Save ----------------

  // Guarda SOLO el catálogo de etiquetas en boards.data (las tareas son
  // relacionales). Conserva la marca de migración para no reintroducir el blob.
  function save() {
    clearTimeout(saveTimer);
    saveStatusEl.textContent = 'Guardando...';
    saveTimer = setTimeout(async function () {
      if (!currentBoard) return;
      const base = (currentBoard.data && typeof currentBoard.data === 'object' && !Array.isArray(currentBoard.data)) ? currentBoard.data : {};
      const nuevo = Object.assign({}, base, { tags: tagCatalog, migratedToTaskItems: true });
      currentBoard.data = nuevo;
      const { error } = await sb.from('boards').update({ data: nuevo, updated_at: new Date().toISOString() }).eq('id', currentBoard.id);
      saveStatusEl.textContent = error ? ('Error al guardar: ' + error.message) : 'Guardado';
      if (!error) setTimeout(function () { if (saveStatusEl.textContent === 'Guardado') saveStatusEl.textContent = ''; }, 1500);
    }, 400);
  }

  // ---------------- Mutaciones relacionales (task_items) ----------------
  function statusOfChangeMsg(e) { saveStatusEl.textContent = e ? ('Error: ' + (e.message || e)) : 'Guardado'; if (!e) setTimeout(function () { if (saveStatusEl.textContent === 'Guardado') saveStatusEl.textContent = ''; }, 1200); }

  // Actualiza columnas editables (solo admin, gateado también en backend).
  async function updateItemFields(id, patch, rerender) {
    const local = byId[id]; if (local) Object.assign(local, patch);
    if (rerender !== false) render();
    saveStatusEl.textContent = 'Guardando...';
    const { error } = await sb.from('task_items').update(patch).eq('id', id);
    statusOfChangeMsg(error);
    if (error) { await loadItems(); render(); }
    return error;
  }
  // Inserta una nueva tarea/subtarea (solo admin).
  async function insertItem(parentId, title, focusIt) {
    const siblings = childrenOf(parentId);
    const pos = siblings.length ? Math.max.apply(null, siblings.map(function (s) { return s.position || 0; })) + 1 : 0;
    const row = { account_id: currentBoard.account_id, board_id: currentBoard.id, parent_id: parentId || null, title: title || '', position: pos };
    saveStatusEl.textContent = 'Guardando...';
    const { data, error } = await sb.from('task_items').insert(row).select('*').single();
    if (error) { statusOfChangeMsg(error); return null; }
    items.push(data); indexItems(); statusOfChangeMsg(null);
    if (parentId) setCollapsed(parentId, false);
    render();
    if (focusIt) focusNode(data.id);
    return data;
  }
  // Llamadas a las RPCs de ciclo de vida (fechas del servidor + permisos backend).
  async function lifecycle(fn, id) {
    saveStatusEl.textContent = '...';
    const { error } = await sb.rpc(fn, { p_id: id });
    if (error) { alert(error.message); saveStatusEl.textContent = ''; return false; }
    await loadItems(); render();
    saveStatusEl.textContent = 'Guardado';
    setTimeout(function () { if (saveStatusEl.textContent === 'Guardado') saveStatusEl.textContent = ''; }, 1200);
    return true;
  }

  // ---------------- Due date helpers ----------------

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function daysUntil(dueDate) {
    const today = new Date(todayStr() + 'T00:00:00');
    const due = new Date(dueDate + 'T00:00:00');
    return Math.round((due - today) / 86400000);
  }

  function dueClass(dueDate) {
    if (!dueDate) return null;
    const diff = daysUntil(dueDate);
    if (diff < 0) return 'd-overdue';
    if (diff === 0) return 'd-today';
    if (diff >= 1 && diff <= 3) return 'd-soon';
    return 'd-later';
  }

  function dueLabel(dueDate) {
    const diff = daysUntil(dueDate);
    if (diff < 0) return dueDate + ' · vencida';
    if (diff === 0) return 'Hoy';
    if (diff === 1) return 'Mañana';
    return dueDate;
  }

  function renderNotifyBanner() {
    const all = items.filter(isLeaf);
    const pend = function (t) { return t.status !== 'completed' && t.status !== 'archived'; };
    const overdue = all.filter(function (t) { return pend(t) && t.due_date && daysUntil(t.due_date) < 0; });
    const today = all.filter(function (t) { return pend(t) && t.due_date && daysUntil(t.due_date) === 0; });
    if (!overdue.length && !today.length) {
      notifyBanner.classList.add('hidden');
      notifyBanner.textContent = '';
      return;
    }
    const parts = [];
    if (overdue.length) parts.push(overdue.length + ' tarea(s) vencida(s)');
    if (today.length) parts.push(today.length + ' que vence(n) hoy');
    notifyBanner.textContent = '⚡ Tienes ' + parts.join(' y ') + '. (Aviso in-app; el correo requiere activar notificaciones por email).';
    notifyBanner.classList.remove('hidden');
  }

  // Estado legible + clase de color.
  const STATUS_LABEL = { pending: 'Pendiente', in_progress: 'En progreso', completed: 'Completada', archived: 'Archivada' };
  function statusChip(status) {
    const s = document.createElement('span');
    s.className = 'st-chip st-' + status;
    s.textContent = STATUS_LABEL[status] || status;
    return s;
  }

  // Nombre de la marca (raíz) a la que pertenece una fila.
  function rootBrand(row) {
    let cur = row, guard = 0;
    while (cur && cur.parent_id && guard < 50) { cur = byId[cur.parent_id]; guard++; }
    return cur ? (cur.title || '').trim() : '';
  }

  // ¿El usuario actual puede ejecutar (iniciar/completar) esta actividad?
  function canAct(row) { return isAdmin || (myRole !== 'viewer' && row.assignee_id === currentUser.id); }

  // ---------------- Meta panel ----------------

  const eventsCache = {};
  async function loadEvents(id) {
    const { data } = await sb.from('task_events').select('*').eq('task_id', id).order('created_at');
    eventsCache[id] = data || [];
    render();
  }
  // Historial en lenguaje natural.
  function eventLine(ev) {
    const who = ev.actor_id ? (memberName(ev.actor_id) || 'Alguien') : 'Sistema';
    const d = ev.detail || {};
    const nm = function (id) { return id ? (memberName(id) || 'usuario') : '—'; };
    switch (ev.type) {
      case 'created':      return who + ' creó la tarea.';
      case 'assigned':     return who + ' asignó a ' + nm(d.to) + '.';
      case 'unassigned':   return who + ' quitó el responsable.';
      case 'reassigned':   return who + ' reasignó: ' + nm(d.from) + ' → ' + nm(d.to) + '.';
      case 'due_changed':  return who + ' cambió la fecha de entrega: ' + (d.from || '—') + ' → ' + (d.to || '—') + '.';
      case 'started':      return who + ' inició la tarea.';
      case 'completed':    return who + ' completó la tarea.';
      case 'reopened':     return who + ' reabrió la tarea.';
      case 'archived':     return who + ' archivó la tarea.';
      case 'unarchived':   return who + ' desarchivó la tarea.';
      case 'child_deleted':return who + ' eliminó la subtarea "' + (d.title || '') + '".';
      default:             return who + ' · ' + ev.type;
    }
  }

  function metaLabeledDate(label, iso) {
    const row = document.createElement('div'); row.className = 'meta-drow';
    const l = document.createElement('span'); l.className = 'meta-dlabel'; l.textContent = label;
    const v = document.createElement('span'); v.className = 'meta-dval';
    v.textContent = iso ? (fmtFecha(iso) + ' · ' + fmtHora(iso)) : '—';
    row.appendChild(l); row.appendChild(v); return row;
  }
  function lockedField(label, value) {
    const row = document.createElement('div'); row.className = 'meta-row';
    const l = document.createElement('label'); l.textContent = label;
    const v = document.createElement('span'); v.className = 'meta-locked';
