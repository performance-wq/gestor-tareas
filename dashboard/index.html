  function renderMetaPanel(task) {
    const panel = document.createElement('div');
    panel.className = 'meta-panel' + (openMetaId === task.id ? ' open' : '');
    const leaf = isLeaf(task);

    // --- Editar (modal; solo dueño/admin de proyecto) ---
    if (isAdmin) {
      const edRow = document.createElement('div'); edRow.className = 'meta-row';
      const edBtn = document.createElement('button'); edBtn.className = 'life-btn'; edBtn.textContent = '✎ Editar';
      edBtn.addEventListener('click', function () { openEditModal(task); });
      edRow.appendChild(edBtn); panel.appendChild(edRow);
    }

    // --- Estado + acciones de ciclo de vida (solo hojas) ---
    if (leaf) {
      const stRow = document.createElement('div'); stRow.className = 'meta-row';
      const stL = document.createElement('label'); stL.textContent = 'Estado:';
      stRow.appendChild(stL); stRow.appendChild(statusChip(task.status));
      panel.appendChild(stRow);

      const actRow = document.createElement('div'); actRow.className = 'meta-row meta-actions';
      function actBtn(txt, cls, fn) { const b = document.createElement('button'); b.className = 'life-btn ' + cls; b.textContent = txt; b.addEventListener('click', fn); actRow.appendChild(b); }
      if ((task.status === 'pending') && canAct(task)) actBtn('▶ Iniciar', 'start', function () { lifecycle('task_start', task.id); });
      if ((task.status === 'pending' || task.status === 'in_progress') && canAct(task)) actBtn('✓ Completar', 'complete', function () { lifecycle('task_complete', task.id); });
      if (task.status === 'completed' && isAdmin) { actBtn('↺ Reabrir', 'reopen', function () { lifecycle('task_reopen', task.id); }); actBtn('Archivar', 'archive', function () { lifecycle('task_archive', task.id); }); }
      if (task.status === 'archived' && isAdmin) { actBtn('↺ Reabrir', 'reopen', function () { lifecycle('task_reopen', task.id); }); actBtn('Desarchivar', 'archive', function () { lifecycle('task_unarchive', task.id); }); }
      if (actRow.childNodes.length) panel.appendChild(actRow);
    }

    // --- Responsable (usuario real). Editable solo por admin. ---
    if (leaf) {
      if (isAdmin) {
        const aRow = document.createElement('div'); aRow.className = 'meta-row';
        const aL = document.createElement('label'); aL.textContent = 'Responsable:';
        const sel = document.createElement('select'); sel.className = 'meta-select';
        const o0 = document.createElement('option'); o0.value = ''; o0.textContent = '— Sin asignar —'; sel.appendChild(o0);
        members.forEach(function (m) { const o = document.createElement('option'); o.value = m.id; o.textContent = memberName(m.id) + (m.isOwner ? ' (admin)' : ''); if (task.assignee_id === m.id) o.selected = true; sel.appendChild(o); });
        sel.addEventListener('change', function () { updateItemFields(task.id, { assignee_id: sel.value || null, assignee_legacy: null }); });
        aRow.appendChild(aL); aRow.appendChild(sel);
        if (task.assignee_legacy && !task.assignee_id) { const hint = document.createElement('span'); hint.className = 'meta-hint'; hint.textContent = '(antes: ' + task.assignee_legacy + ')'; aRow.appendChild(hint); }
        panel.appendChild(aRow);
      } else {
        panel.appendChild(lockedField('Responsable:', assigneeLabel(task)));
      }
    }

    // --- Fecha de entrega. Editable solo por admin. ---
    if (isAdmin) {
      const dRow = document.createElement('div'); dRow.className = 'meta-row';
      const dL = document.createElement('label'); dL.textContent = 'Entrega:';
      const dI = document.createElement('input'); dI.type = 'date'; dI.value = task.due_date || '';
      dI.addEventListener('change', function () { updateItemFields(task.id, { due_date: dI.value || null }); });
      dRow.appendChild(dL); dRow.appendChild(dI);
      panel.appendChild(dRow);
    } else if (task.due_date) {
      panel.appendChild(lockedField('Entrega:', task.due_date));
    }

    // --- Fechas reales (siempre solo lectura; las genera el servidor) ---
    if (leaf) {
      const dates = document.createElement('div'); dates.className = 'meta-dates';
      dates.appendChild(metaLabeledDate('Creación', task.created_at));
      dates.appendChild(metaLabeledDate('Inicio', task.started_at));
      dates.appendChild(metaLabeledDate('Finalización', task.completed_at));
      dates.appendChild(metaLabeledDate('Archivo', task.archived_at));
      panel.appendChild(dates);
    }

    // --- Etiquetas (edición solo admin) ---
    const tagsRow = document.createElement('div'); tagsRow.className = 'meta-row';
    const tagsLabel = document.createElement('label'); tagsLabel.textContent = 'Etiquetas:';
    const tagsWrap = document.createElement('div'); tagsWrap.className = 'meta-tags';
    (task.tags || []).forEach(function (tag, i) {
      const chip = document.createElement('span'); chip.className = 'meta-tag-chip'; chip.textContent = tag; styleChip(chip, tagColor(tag));
      if (isAdmin) { const rm = document.createElement('button'); rm.textContent = '×'; rm.addEventListener('click', function () { task.tags.splice(i, 1); updateItemFields(task.id, { tags: task.tags }); }); chip.appendChild(rm); }
      tagsWrap.appendChild(chip);
    });
    if (isAdmin) {
      const addTagBtn = document.createElement('button'); addTagBtn.className = 'tag-add-btn'; addTagBtn.textContent = '＋ Etiqueta';
      addTagBtn.addEventListener('click', function () { openTagPickerId = openTagPickerId === task.id ? null : task.id; render(); });
      tagsWrap.appendChild(addTagBtn);
    }
    tagsRow.appendChild(tagsLabel); tagsRow.appendChild(tagsWrap);
    panel.appendChild(tagsRow);

    if (isAdmin && openTagPickerId === task.id) {
      const picker = document.createElement('div'); picker.className = 'tag-picker';
      if (!tagCatalog.length) { const empty = document.createElement('div'); empty.className = 'tags-empty'; empty.textContent = 'Aún no hay etiquetas. Crea la primera abajo.'; picker.appendChild(empty); }
      tagCatalog.forEach(function (t) {
        const opt = document.createElement('div'); opt.className = 'tag-opt';
        const sw = document.createElement('span'); sw.className = 'tag-swatch'; sw.style.background = t.color;
        const nm = document.createElement('span'); nm.className = 'tag-opt-name'; nm.textContent = t.name;
        opt.appendChild(sw); opt.appendChild(nm);
        if ((task.tags || []).indexOf(t.name) >= 0) { const ck = document.createElement('span'); ck.className = 'tag-opt-check'; ck.textContent = '✓'; opt.appendChild(ck); }
        opt.addEventListener('click', function () { toggleTaskTag(task, t.name); save(); updateItemFields(task.id, { tags: task.tags }); });
        picker.appendChild(opt);
      });
      const newRow = document.createElement('div'); newRow.className = 'tag-picker-new';
      const newInput = document.createElement('input'); newInput.type = 'text'; newInput.placeholder = 'Crear nueva etiqueta + Enter';
      newInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); const val = newInput.value.trim(); if (val) { toggleTaskTag(task, val); newInput.value = ''; save(); updateItemFields(task.id, { tags: task.tags }); } } });
      newRow.appendChild(newInput); picker.appendChild(newRow); panel.appendChild(picker);
    }

    // --- Historial de la tarea ---
    const histRow = document.createElement('div'); histRow.className = 'meta-row';
    const histBtn = document.createElement('button'); histBtn.className = 'tag-add-btn';
    histBtn.textContent = openHistoryId === task.id ? 'Ocultar historial' : 'Ver historial';
    histBtn.addEventListener('click', function () {
      openHistoryId = openHistoryId === task.id ? null : task.id;
      if (openHistoryId === task.id && !eventsCache[task.id]) loadEvents(task.id); else render();
    });
    histRow.appendChild(histBtn); panel.appendChild(histRow);
    if (openHistoryId === task.id) {
      const hist = document.createElement('div'); hist.className = 'history-list';
      const evs = eventsCache[task.id];
      if (!evs) { hist.textContent = 'Cargando…'; }
      else if (!evs.length) { hist.textContent = 'Sin eventos registrados.'; }
      else evs.forEach(function (ev) {
        const it = document.createElement('div'); it.className = 'history-item';
        const t = document.createElement('div'); t.className = 'history-when'; t.textContent = fmtFecha(ev.created_at) + ' · ' + fmtHora(ev.created_at);
        const m = document.createElement('div'); m.className = 'history-msg'; m.textContent = eventLine(ev);
        it.appendChild(t); it.appendChild(m); hist.appendChild(it);
      });
      panel.appendChild(hist);
    }

    // --- Eliminar (solo admin/dueño; nunca completadas/archivadas) ---
    if (isAdmin && task.status !== 'completed' && task.status !== 'archived') {
      const delRow = document.createElement('div'); delRow.className = 'meta-row';
      const delBtn = document.createElement('button'); delBtn.className = 'meta-delete';
      delBtn.textContent = leaf ? 'Eliminar' : 'Eliminar (y sus subtareas)';
      delBtn.addEventListener('click', function () { openDeleteModal(task); });
      delRow.appendChild(delBtn); panel.appendChild(delRow);
    }

    return panel;
  }

  // Modal de edición (§1,2): NO guarda al escribir, solo con "Guardar cambios".
  function openEditModal(task) {
    const leaf = isLeaf(task);
    const isSub = !!task.parent_id;
    const fields = [
      { key: 'title', label: isSub ? 'Nombre de la subtarea' : 'Nombre de la tarea', type: 'text', value: task.title || '' },
      { key: 'description', label: 'Descripción', type: 'textarea', value: task.description || '' }
    ];
    if (leaf) fields.push({ key: 'assignee_id', label: 'Responsable', type: 'select', value: task.assignee_id || '', options: assigneeOptions() });
    fields.push({ key: 'due_date', label: 'Fecha de entrega', type: 'date', value: task.due_date || '' });
    formModal({
      title: isSub ? 'Editar subtarea' : 'Editar tarea', okText: 'Guardar cambios', fields: fields,
      onSave: async function (vals) {
        const patch = { title: (vals.title || '').trim(), description: (vals.description || '').trim() || null, due_date: vals.due_date || null };
        if (leaf) { patch.assignee_id = vals.assignee_id || null; patch.assignee_legacy = null; }
        const err = await updateItemFields(task.id, patch);
        if (err) { toast('No se pudo guardar.', 'err'); return false; }
        toast((isSub ? 'Subtarea' : 'Tarea') + ' actualizada correctamente', 'ok');
      }
    });
  }
  // Modal de eliminación (§3,4): confirmación con estilo de advertencia + toast.
  function openDeleteModal(task) {
    const isSub = !!task.parent_id;
    const kids = childrenOf(task.id).length;
    let msg = '¿Seguro que deseas eliminar esta ' + (isSub ? 'subtarea' : 'tarea') + '?<br><b>' + escapeHtml(task.title || '(sin título)') + '</b>';
    if (kids) msg += '<br><br>Esta tarea contiene ' + kids + ' subtarea(s). Si continúas, también se eliminarán.';
    msg += '<br><span style="opacity:.75">Queda registrada en el historial y no se puede deshacer.</span>';
    confirmDialog({
      title: isSub ? 'Eliminar subtarea' : 'Eliminar tarea',
      message: msg, danger: true, okText: isSub ? 'Eliminar subtarea' : 'Eliminar tarea',
      onOk: async function () {
        const { error } = await sb.rpc('task_delete', { p_id: task.id });
        if (error) { toast(error.message || 'No se pudo eliminar.', 'err'); return; }
        await loadItems(); render();
        toast((isSub ? 'Subtarea' : 'Tarea') + ' eliminada correctamente', 'ok');
      }
    });
  }

  // ---------------- Render de la lista ----------------

  // Enfoca el texto de un nodo recién creado.
  function focusNode(id) {
    requestAnimationFrame(function () {
      const el = matrixViewEl.querySelector('.tnode[data-id="' + id + '"] > .tnode-row > .tnode-text');
      if (el) el.focus();
    });
  }
  // Elimina (solo admin) vía RPC con confirmación, gestionado desde el menú ⋯.
  function removeNodeAnimated(id) {
    const row = byId[id]; if (!row) return;
    lifecycle('task_delete', id);
  }

  // ---------------- Estado de plegado POR USUARIO ----------------
  // El plegado no se guarda en el board compartido (sería común a todos): cada
  // usuario organiza su propio espacio. Se persiste en localStorage por
  // usuario + board, así al refrescar se conserva qué grupos dejó abiertos/cerrados.
  let collapseState = {};
  function collapseKey() { return 'collapse_' + (currentUser ? currentUser.id : 'anon') + '_' + (currentBoard ? currentBoard.id : '0'); }
  function loadCollapse() {
    try { collapseState = JSON.parse(localStorage.getItem(collapseKey()) || '{}') || {}; }
    catch (_) { collapseState = {}; }
  }
  function saveCollapse() {
    try { localStorage.setItem(collapseKey(), JSON.stringify(collapseState)); } catch (_) {}
  }
  function isCollapsed(id) { return !!collapseState[id]; }
  function setCollapsed(id, val) { if (val) collapseState[id] = 1; else delete collapseState[id]; saveCollapse(); }

  // Sección de completadas: abierta/cerrada, también por usuario.
  function completedOpen() { return localStorage.getItem('doneOpen_' + (currentUser ? currentUser.id : 'anon')) === '1'; }
  function setCompletedOpen(v) { try { localStorage.setItem('doneOpen_' + (currentUser ? currentUser.id : 'anon'), v ? '1' : '0'); } catch (_) {} }

  // ---------------- Hojas, agrupadores y conteos ----------------

  // Una actividad (hoja) está "fuera de pendientes" si está completada o archivada.
  function isDone(row) { return row.status === 'completed' || row.status === 'archived'; }
  // ¿El nodo (o su subárbol) tiene alguna actividad operativa pendiente?
  function hasPendingLeaf(row) {
    if (isLeaf(row)) return !isDone(row);
    return childrenOf(row.id).some(hasPendingLeaf);
  }
  // Nº de actividades operativas (hojas) pendientes bajo un nodo.
  function pendingLeafCount(row) {
    if (isLeaf(row)) return isDone(row) ? 0 : 1;
    return childrenOf(row.id).reduce(function (a, c) { return a + pendingLeafCount(c); }, 0);
  }
  // Todas las hojas completadas/archivadas, con su marca (raíz) asociada.
  function completedLeaves() {
    return items.filter(function (r) { return isLeaf(r) && isDone(r); })
      .map(function (r) { return { node: r, brand: rootBrand(r) }; });
  }

  // ---------------- Fecha / hora en español ----------------
  const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
  function fmtFecha(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return '—';
    return d.getDate() + ' ' + MESES[d.getMonth()] + ' ' + d.getFullYear();
  }
  function fmtHora(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    let h = d.getHours(); const m = String(d.getMinutes()).padStart(2, '0');
    const ap = h < 12 ? 'AM' : 'PM'; h = h % 12; if (h === 0) h = 12;
    return h + ':' + m + ' ' + ap;
  }
  function esHoy(iso) {
    if (!iso) return false;
    const d = new Date(iso); if (isNaN(d)) return false;
    const n = new Date();
    return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
  }


  // ---------------- Etiquetas reutilizables ----------------

  // Paleta consistente: cada etiqueta conserva su color.
  const TAG_COLORS = ['#b06bff', '#35e5ff', '#2ee6a6', '#ff9f43', '#ff4d6d', '#ff2fd0', '#5b8cff', '#f7d154', '#22d3ee', '#a3e635'];

  function hexA(hex, a) {
    const h = (hex || '#948bc4').replace('#', '');
    const n = parseInt(h.length === 3 ? h.replace(/(.)/g, '$1$1') : h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function findTag(name) { return tagCatalog.find(function (t) { return t.name === name; }); }
  function nextTagColor() { return TAG_COLORS[tagCatalog.length % TAG_COLORS.length]; }
  // Crea la etiqueta en el catálogo si no existe y la deja disponible globalmente.
  function ensureTag(name) {
    name = (name || '').trim();
    if (!name) return null;
    let t = findTag(name);
    if (!t) { t = { name: name, color: nextTagColor() }; tagCatalog.push(t); }
    return t;
  }
  function tagColor(name) { const t = findTag(name); return t ? t.color : '#948bc4'; }
  function normalizeTags(list) {
    const out = [];
    (list || []).forEach(function (t) {
      if (t && t.name && !out.some(function (x) { return x.name === t.name; })) {
        out.push({ name: String(t.name), color: t.color || TAG_COLORS[out.length % TAG_COLORS.length] });
      }
    });
    return out;
  }
  function styleChip(el, color) {
    el.style.background = hexA(color, 0.16);
    el.style.color = color;
    el.style.borderColor = hexA(color, 0.5);
  }
  function dedupeTags(n) { if (n.tags) n.tags = n.tags.filter(function (x, i) { return n.tags.indexOf(x) === i; }); }
  function toggleTaskTag(task, name) {
    task.tags = task.tags || [];
    const i = task.tags.indexOf(name);
    if (i >= 0) task.tags.splice(i, 1);
    else { ensureTag(name); task.tags.push(name); }
  }
  function setTagColor(name, color) { const t = findTag(name); if (t) t.color = color; }
  function persistItemTags(row) { sb.from('task_items').update({ tags: row.tags }).eq('id', row.id).then(function () {}); }
  function renameTag(oldName, newName) {
    newName = (newName || '').trim();
    if (!newName || newName === oldName) return;
    const t = findTag(oldName);
    if (t) t.name = newName;
    tagCatalog = normalizeTags(tagCatalog); // deduplica si el nuevo nombre ya existía
    items.forEach(function (n) {
      if (Array.isArray(n.tags) && n.tags.indexOf(oldName) >= 0) { n.tags = n.tags.map(function (x) { return x === oldName ? newName : x; }); dedupeTags(n); persistItemTags(n); }
    });
  }
  function deleteTag(name) {
    tagCatalog = tagCatalog.filter(function (t) { return t.name !== name; });
    items.forEach(function (n) { if (Array.isArray(n.tags) && n.tags.indexOf(name) >= 0) { n.tags = n.tags.filter(function (x) { return x !== name; }); persistItemTags(n); } });
  }
  function mergeTag(from, into) {
    if (from === into) return;
    items.forEach(function (n) {
      if (Array.isArray(n.tags) && n.tags.indexOf(from) >= 0) { n.tags = n.tags.map(function (x) { return x === from ? into : x; }); dedupeTags(n); persistItemTags(n); }
    });
    tagCatalog = tagCatalog.filter(function (t) { return t.name !== from; });
  }

  // ---------------- Drag & drop: mover nodos (solo admin) ----------------

  function descendantsOf(id) {
    const out = {};
    (function walk(pid) { childrenOf(pid).forEach(function (c) { out[c.id] = 1; walk(c.id); }); })(id);
    return out;
  }
  // No se puede soltar sobre sí mismo ni dentro de su propia descendencia.
  function canDrop(dId, targetId) {
    if (!dId || !targetId || dId === targetId) return false;
    return !descendantsOf(dId)[targetId];
  }
  // Reubica un nodo bajo newParent en la posición index y persiste el orden.
  async function applyMove(dId, newParent, index) {
    const drag = byId[dId]; if (!drag) return;
    drag.parent_id = newParent || null;
    let sibs = childrenOf(newParent).filter(function (s) { return s.id !== dId; });
    sibs.splice(index, 0, drag);
    const changed = [];
    sibs.forEach(function (r, i) { if (r.position !== i) { r.position = i; changed.push(r); } });
    indexItems(); render();
    saveStatusEl.textContent = 'Guardando...';
    await sb.from('task_items').update({ parent_id: newParent || null, position: drag.position }).eq('id', dId);
    for (const r of changed) { if (r.id !== dId) await sb.from('task_items').update({ position: r.position }).eq('id', r.id); }
    statusOfChangeMsg(null);
  }
  async function moveNode(dId, targetId, zone) {
    if (!isAdmin || !canDrop(dId, targetId)) return;
    const target = byId[targetId]; if (!target) return;
    let newParent, index;
    if (zone === 'inside') { newParent = target.id; index = childrenOf(target.id).filter(function (s) { return s.id !== dId; }).length; setCollapsed(target.id, false); }
    else {
      newParent = target.parent_id || null;
      const sibs = childrenOf(newParent).filter(function (s) { return s.id !== dId; });
      const ti = sibs.findIndex(function (s) { return s.id === targetId; });
      index = (ti < 0 ? sibs.length : ti) + (zone === 'after' ? 1 : 0);
    }
    await applyMove(dId, newParent, index);
  }
  function clearDropIndicators() {
    matrixViewEl.querySelectorAll('.drop-before, .drop-after, .drop-inside').forEach(function (el) {
      el.classList.remove('drop-before', 'drop-after', 'drop-inside');
    });
  }
  function zoneFromEvent(rowEl, e) {
    const r = rowEl.getBoundingClientRect();
    const y = e.clientY - r.top;
    const h = r.height || 1;
    if (y < h * 0.30) return 'before';
    if (y > h * 0.70) return 'after';
    return 'inside';
  }

  // Hijos VISIBLES en la vista de pendientes: se ocultan las actividades (hojas)
  // ya completadas/archivadas —viven en el historial inferior— y los agrupadores
  // sin trabajo pendiente. La marca (raíz) siempre permanece visible.
  function visibleChildren(row) {
    return childrenOf(row.id).filter(function (c) {
      return isLeaf(c) ? !isDone(c) : hasPendingLeaf(c);
    });
  }

  // Renderiza un nodo y sus descendientes PENDIENTES. La marca (raíz) agrupa y
  // sus hojas son las actividades operativas con ciclo de vida.
  function renderNode(node, level) {
    const leaf = isLeaf(node);
    const kids = visibleChildren(node);
    const hasKids = kids.length > 0;
    const isRoot = level === 1;
    const act = leaf && canAct(node);

    const wrap = document.createElement('div');
    wrap.className = 'tnode lvl-' + Math.min(level, 5) + (isRoot ? ' card' : '');
    wrap.dataset.id = node.id;

    const row = document.createElement('div');
    row.className = 'tnode-row' + (isRoot ? ' brand-row' : '');

    if (isAdmin) {
      row.addEventListener('dragover', function (e) {
        if (!dragId) return;
        e.stopPropagation();
        if (!canDrop(dragId, node.id)) return;
        e.preventDefault();
        clearDropIndicators();
        row.classList.add('drop-' + zoneFromEvent(row, e));
      });
      row.addEventListener('drop', function (e) {
        if (!dragId) return;
        e.stopPropagation();
        if (!canDrop(dragId, node.id)) { clearDropIndicators(); return; }
        e.preventDefault();
        const zone = zoneFromEvent(row, e);
        clearDropIndicators();
        moveNode(dragId, node.id, zone);
        dragId = null;
      });
    }

    // Manija de arrastre (solo admin).
    const grip = document.createElement('span');
    grip.className = 'tnode-grip';
    grip.textContent = '≡';
    grip.title = 'Arrastra para mover';
    if (isAdmin) {
      grip.draggable = true;
      grip.addEventListener('dragstart', function (e) {
        dragId = node.id; wrap.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', node.id); } catch (_) {}
        try { e.dataTransfer.setDragImage(wrap, 12, 12); } catch (_) {}
      });
      grip.addEventListener('dragend', function () { wrap.classList.remove('dragging'); clearDropIndicators(); dragId = null; });
    } else { grip.style.visibility = 'hidden'; }

    // Plegado por usuario.
    const collapsed = isCollapsed(node.id);
    function toggleCollapse() { if (hasKids) { setCollapsed(node.id, !isCollapsed(node.id)); render(); } }

    const chevron = document.createElement('span');
    chevron.className = 'tnode-chevron' + (hasKids ? '' : ' hidden-chevron') + (hasKids && !collapsed ? ' expanded' : '');
    chevron.textContent = '▸';
    chevron.title = 'Expandir / contraer';
    chevron.addEventListener('click', toggleCollapse);

    // Casilla de completar (solo hojas que el usuario puede ejecutar).
    const check = document.createElement('span');
    check.className = 'tnode-check';
    if (leaf) {
      if (act) { check.title = 'Completar'; check.addEventListener('click', function () { lifecycle('task_complete', node.id); }); }
      else { check.classList.add('disabled'); check.title = 'Solo el responsable puede completar'; }
    } else { check.classList.add('hidden-check'); }

    // Texto (título). Editable solo por el admin.
    const text = document.createElement('div');
    text.className = 'tnode-text';
    const grouper = !leaf;
    text.dataset.placeholder = isRoot ? 'Nombre de la marca o proyecto...' : 'Actividad...';
    text.textContent = node.title || '';
    if (grouper) {
      text.classList.add('is-grouper');
      text.contentEditable = 'false';
      text.title = isAdmin ? 'Clic: plegar/desplegar · doble clic: renombrar' : 'Clic: plegar/desplegar';
      text.addEventListener('click', function () { toggleCollapse(); });
      if (isAdmin) {
        text.addEventListener('dblclick', function () {
          text.contentEditable = 'true'; text.classList.add('editing'); text.focus();
          const r = document.createRange(); r.selectNodeContents(text);
          const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        });
      }
    } else {
      text.contentEditable = isAdmin ? 'true' : 'false';
    }
    if (isAdmin) {
      let orig = node.title || '';
      text.addEventListener('blur', function () {
        text.contentEditable = grouper ? 'false' : 'true'; text.classList.remove('editing');
        const nv = text.textContent.trim();
        if (nv !== (orig || '').trim()) { node.title = nv; orig = nv; updateItemFields(node.id, { title: nv }, false); }
      });
      text.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); text.blur(); }
        else if (e.key === 'Backspace' && text.textContent === '' && leaf && !isRoot) { e.preventDefault(); removeNodeAnimated(node.id); }
      });
    }

    // Botón agregar subtarea (solo admin).
    const add = document.createElement('button');
    add.className = 'tnode-add';
    add.textContent = '＋';
    add.title = 'Agregar subtarea';
    if (isAdmin) add.addEventListener('click', function () { insertItem(node.id, '', true); });
    else add.style.display = 'none';

    // Menú ⋯ (detalle, responsable, fechas, historial, eliminar).
    const menu = document.createElement('button');
    menu.className = 'tnode-menu';
    menu.textContent = '⋯';
    menu.title = 'Opciones';
    menu.addEventListener('click', function () { openMetaId = openMetaId === node.id ? null : node.id; render(); });

    // Metadatos en la fila: etiquetas, entrega, estado/acciones, responsable.
    const meta = document.createElement('div');
    meta.className = 'tnode-meta';
    (node.tags || []).forEach(function (tag) {
      const chip = document.createElement('span'); chip.className = 'tag-chip'; chip.textContent = tag; styleChip(chip, tagColor(tag)); meta.appendChild(chip);
    });
    if (node.due_date) {
      const badge = document.createElement('span'); badge.className = 'due-badge ' + dueClass(node.due_date); badge.textContent = dueLabel(node.due_date); meta.appendChild(badge);
    }
    if (leaf) {
      // Estado + "Iniciar".
      if (node.status === 'in_progress') { const pill = document.createElement('span'); pill.className = 'st-chip st-in_progress'; pill.textContent = 'En progreso'; meta.appendChild(pill); }
      if (node.status === 'pending' && act) { const sb2 = document.createElement('button'); sb2.className = 'start-btn'; sb2.textContent = '▶ Iniciar'; sb2.addEventListener('click', function (e) { e.stopPropagation(); lifecycle('task_start', node.id); }); meta.appendChild(sb2); }
      // Responsable.
      const who = document.createElement('span');
      const asg = assigneeLabel(node);
      who.className = 'assignee-chip' + (asg ? '' : ' empty') + (isAdmin ? '' : ' ro');
      who.textContent = asg || (isAdmin ? 'Responsable' : '—');
      who.title = isAdmin ? 'Asignar responsable' : 'Responsable';
      who.addEventListener('click', function (e) { e.stopPropagation(); openMetaId = node.id; render(); });
      meta.appendChild(who);
    } else {
      const pc = pendingLeafCount(node);
      const count = document.createElement('span'); count.className = 'group-count' + (pc === 0 ? ' complete' : '');
      count.textContent = pc === 0 ? 'al día' : (isRoot ? (pc + (pc === 1 ? ' pendiente' : ' pendientes')) : String(pc));
      meta.appendChild(count);
    }

    row.appendChild(grip);
    row.appendChild(chevron);
    row.appendChild(check);
    row.appendChild(text);
    if (meta.childNodes.length) row.appendChild(meta);
    row.appendChild(add);
    row.appendChild(menu);
    wrap.appendChild(row);

    wrap.appendChild(renderMetaPanel(node));

    const childrenWrap = document.createElement('div');
    childrenWrap.className = 'tnode-children' + (hasKids && !collapsed ? ' expanded' : '');
    const childrenInner = document.createElement('div');
    childrenInner.className = 'tnode-children-inner';
    kids.forEach(function (child) { childrenInner.appendChild(renderNode(child, level + 1)); });
    childrenWrap.appendChild(childrenInner);
    wrap.appendChild(childrenWrap);

    return wrap;
  }

  // Soltar en zona vacía: mover a nivel de marca (raíz). Solo admin.
  async function moveNodeToRoot(dId) {
    if (!isAdmin) return;
    await applyMove(dId, null, childrenOf(null).filter(function (s) { return s.id !== dId; }).length);
  }
  // Crea una nueva marca / tarea principal (solo admin).
  function addRootTask() { if (isAdmin) insertItem(null, '', true); }

  // ---------------- Sección de completadas / archivadas ----------------

  function renderCompletedSection(container, doneList) {
    const section = document.createElement('div');
    section.className = 'completed-section';
    const open = completedOpen();

    const head = document.createElement('div');
    head.className = 'completed-head';
    const chev = document.createElement('span'); chev.className = 'completed-chev' + (open ? ' open' : ''); chev.textContent = '▸';
    const title = document.createElement('span'); title.className = 'completed-title'; title.textContent = 'Tareas completadas / archivadas';
    const cnt = document.createElement('span'); cnt.className = 'completed-count'; cnt.textContent = '(' + doneList.length + ')';
    head.appendChild(chev); head.appendChild(title); head.appendChild(cnt);
    head.addEventListener('click', function () { setCompletedOpen(!completedOpen()); render(); });
    section.appendChild(head);

    if (open) {
      const body = document.createElement('div'); body.className = 'completed-body';
      if (!doneList.length) { const empty = document.createElement('div'); empty.className = 'completed-empty'; empty.textContent = 'Aún no hay actividades completadas.'; body.appendChild(empty); }
      doneList.forEach(function (d) {
        const n = d.node;
        const item = document.createElement('div'); item.className = 'completed-item';
        const ck = document.createElement('span'); ck.className = 'completed-restore'; ck.textContent = '✓'; ck.title = n.status === 'archived' ? 'Archivada' : 'Completada';
        const info = document.createElement('div'); info.className = 'completed-info';
        const nmRow = document.createElement('div'); nmRow.className = 'completed-name';
        nmRow.textContent = n.title || '(sin título)';
        nmRow.appendChild(statusChip(n.status));
        const sub = document.createElement('div'); sub.className = 'completed-meta';
        const who = assigneeLabel(n);
        sub.textContent = [d.brand, who].filter(Boolean).join(' · ');
        const dates = document.createElement('div'); dates.className = 'completed-dates';
        function line(lbl, iso) { if (!iso) return; const s = document.createElement('span'); s.className = 'cdate'; s.textContent = lbl + ': ' + fmtFecha(iso) + ' · ' + fmtHora(iso); dates.appendChild(s); }
        line('Inicio', n.started_at); line('Finalizada', n.completed_at); line('Archivada', n.archived_at);
        info.appendChild(nmRow); info.appendChild(sub); info.appendChild(dates);
        // Acciones de admin.
        if (isAdmin) {
          const acts = document.createElement('div'); acts.className = 'completed-acts';
          function ab(t, fn) { const b = document.createElement('button'); b.className = 'life-btn small'; b.textContent = t; b.addEventListener('click', fn); acts.appendChild(b); }
          ab('Reabrir', function () { lifecycle('task_reopen', n.id); });
          if (n.status === 'completed') ab('Archivar', function () { lifecycle('task_archive', n.id); });
          if (n.status === 'archived') ab('Desarchivar', function () { lifecycle('task_unarchive', n.id); });
          info.appendChild(acts);
        }
        item.appendChild(ck); item.appendChild(info);
        body.appendChild(item);
      });
      section.appendChild(body);
    }
    container.appendChild(section);
  }

  // ---------------- Render (dispatcher lista / dashboard) ----------------
  function render() {
    updateToggle();
    if (view === 'dashboard') {
      matrixViewEl.style.display = 'none';
      dashboardViewEl.style.display = 'block';
      renderDashboard();
    } else {
      dashboardViewEl.style.display = 'none';
      matrixViewEl.style.display = 'block';
      renderList();
    }
  }

  function renderList() {
    matrixViewEl.innerHTML = '';
    const pend = document.createElement('div'); pend.className = 'pending-list';
    if (isAdmin) {
      pend.addEventListener('dragover', function (e) { if (dragId) e.preventDefault(); });
      pend.addEventListener('drop', function (e) { if (!dragId) return; e.preventDefault(); clearDropIndicators(); moveNodeToRoot(dragId); dragId = null; });
    }
    const roots = rootItems().filter(function (r) { return isLeaf(r) ? !isDone(r) : true; });
    if (!roots.length) {
      const empty = document.createElement('div'); empty.className = 'list-empty';
      empty.textContent = isAdmin ? 'No hay tareas. Crea una marca o proyecto para empezar.' : 'No hay tareas asignadas todavía.';
      pend.appendChild(empty);
    } else roots.forEach(function (r) { pend.appendChild(renderNode(r, 1)); });
    matrixViewEl.appendChild(pend);

    if (isAdmin) {
      const addBtn = document.createElement('button'); addBtn.className = 'addroot-btn'; addBtn.textContent = '＋ Nueva tarea principal';
      addBtn.addEventListener('click', addRootTask); matrixViewEl.appendChild(addBtn);
    }

    const doneList = completedLeaves().sort(function (a, b) {
      return (b.node.completed_at || b.node.archived_at || '').localeCompare(a.node.completed_at || a.node.archived_at || '');
    });
    if (doneList.length) { const sep = document.createElement('div'); sep.className = 'list-sep'; matrixViewEl.appendChild(sep); renderCompletedSection(matrixViewEl, doneList); }

    const leaves = items.filter(isLeaf);
    const doneCount = leaves.filter(isDone).length;
    countEl.textContent = leaves.length + ' actividad(es) · ' + doneCount + ' completada(s)';
    if (tagsPanel.classList.contains('open')) renderTagsManager();
    renderNotifyBanner();
  }

  // ---------------- Dashboard operativo ----------------
  let dash = { range: 'today', from: null, to: null, resp: '', brand: '', status: '' };
  let dashDrill = null;

  function rootIdOf(row) { let c = row, g = 0; while (c && c.parent_id && g < 50) { c = byId[c.parent_id]; g++; } return c ? c.id : row.id; }
  function startOfDay(dt) { return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate(), 0, 0, 0, 0); }
  function endOfDay(dt) { return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate(), 23, 59, 59, 999); }
  function rangeDates() {
    const now = new Date(); const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
    if (dash.range === 'today') return [startOfDay(now), endOfDay(now)];
    if (dash.range === 'yesterday') { const yd = new Date(y, m, d - 1); return [startOfDay(yd), endOfDay(yd)]; }
    if (dash.range === 'week') { const dow = (now.getDay() + 6) % 7; const mon = new Date(y, m, d - dow); return [startOfDay(mon), endOfDay(now)]; }
    if (dash.range === 'month') return [new Date(y, m, 1, 0, 0, 0, 0), endOfDay(now)];
    if (dash.range === 'custom') { const f = dash.from ? new Date(dash.from + 'T00:00:00') : startOfDay(now); const t = dash.to ? new Date(dash.to + 'T23:59:59') : endOfDay(now); return [f, t]; }
    return [startOfDay(now), endOfDay(now)];
  }
  function inRange(iso, a, b) { if (!iso) return false; const t = new Date(iso).getTime(); return t >= a.getTime() && t <= b.getTime(); }
  function sameDay(iso, dayISO) { if (!iso) return false; const d = new Date(iso); const s = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); return s === dayISO; }
  function dayKey(dt) { return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'); }
  function matchRB(row) { return (!dash.resp || row.assignee_id === dash.resp) && (!dash.brand || rootIdOf(row) === dash.brand); }

  function renderDashboard() {
    dashboardViewEl.innerHTML = '';
    const [a, b] = rangeDates();
    const leaves = items.filter(isLeaf);

    // --- Controles ---
    const bar = document.createElement('div'); bar.className = 'dash-bar';
    function sel(label, value, opts, on) {
      const w = document.createElement('div'); w.className = 'dash-f';
      const l = document.createElement('label'); l.textContent = label; w.appendChild(l);
      const s = document.createElement('select'); opts.forEach(function (o) { const op = document.createElement('option'); op.value = o.v; op.textContent = o.t; if (o.v === value) op.selected = true; s.appendChild(op); });
      s.addEventListener('change', function () { on(s.value); }); w.appendChild(s); return w;
    }
    bar.appendChild(sel('Periodo', dash.range, [
      { v: 'today', t: 'Hoy' }, { v: 'yesterday', t: 'Ayer' }, { v: 'week', t: 'Esta semana' }, { v: 'month', t: 'Este mes' }, { v: 'custom', t: 'Rango personalizado' }
    ], function (v) { dash.range = v; dashDrill = null; render(); }));
    if (dash.range === 'custom') {
      const cw = document.createElement('div'); cw.className = 'dash-f';
      const l = document.createElement('label'); l.textContent = 'Rango'; cw.appendChild(l);
      const wrap = document.createElement('div'); wrap.className = 'dash-range';
      const f = document.createElement('input'); f.type = 'date'; f.value = dash.from || ''; f.addEventListener('change', function () { dash.from = f.value || null; render(); });
      const t = document.createElement('input'); t.type = 'date'; t.value = dash.to || ''; t.addEventListener('change', function () { dash.to = t.value || null; render(); });
      wrap.appendChild(f); wrap.appendChild(document.createTextNode('→')); wrap.appendChild(t); cw.appendChild(wrap); bar.appendChild(cw);
    }
    const respOpts = [{ v: '', t: 'Todos' }].concat(members.map(function (m) { return { v: m.id, t: memberName(m.id) }; }));
    bar.appendChild(sel('Responsable', dash.resp, respOpts, function (v) { dash.resp = v; dashDrill = null; render(); }));
    const brandOpts = [{ v: '', t: 'Todas' }].concat(rootItems().map(function (r) { return { v: r.id, t: r.title || '(sin nombre)' }; }));
    bar.appendChild(sel('Marca', dash.brand, brandOpts, function (v) { dash.brand = v; dashDrill = null; render(); }));
    bar.appendChild(sel('Estado', dash.status, [
      { v: '', t: 'Todos' }, { v: 'pending', t: 'Pendiente' }, { v: 'in_progress', t: 'En progreso' }, { v: 'completed', t: 'Completada' }, { v: 'archived', t: 'Archivada' }
    ], function (v) { dash.status = v; render(); }));
    dashboardViewEl.appendChild(bar);

    const rangeNote = document.createElement('div'); rangeNote.className = 'dash-note';
    rangeNote.textContent = 'Periodo: ' + fmtFecha(a.toISOString()) + ' – ' + fmtFecha(b.toISOString());
    dashboardViewEl.appendChild(rangeNote);

    // --- KPIs (solo hojas; resp/marca aplican; iniciadas/completadas/archivadas por fecha real) ---
    const base = leaves.filter(matchRB);
    const kIni = base.filter(function (r) { return inRange(r.started_at, a, b); }).length;
    const kCom = base.filter(function (r) { return inRange(r.completed_at, a, b); }).length;
    const kArc = base.filter(function (r) { return inRange(r.archived_at, a, b); }).length;
    const kPen = base.filter(function (r) { return r.status === 'pending'; }).length;
    const kProg = base.filter(function (r) { return r.status === 'in_progress'; }).length;
    const kpis = document.createElement('div'); kpis.className = 'kpi-grid';
    [['Iniciadas', kIni, 'ini'], ['Pendientes', kPen, 'pen'], ['En progreso', kProg, 'prog'], ['Completadas', kCom, 'com'], ['Archivadas', kArc, 'arc']].forEach(function (k) {
      const c = document.createElement('div'); c.className = 'kpi kpi-' + k[2];
      const n = document.createElement('div'); n.className = 'kpi-n'; n.textContent = k[1];
      const t = document.createElement('div'); t.className = 'kpi-t'; t.textContent = k[0];
      c.appendChild(n); c.appendChild(t); kpis.appendChild(c);
    });
    dashboardViewEl.appendChild(kpis);

    // --- Rendimiento por responsable ---
    const perf = document.createElement('div'); perf.className = 'dash-block';
    const perfH = document.createElement('h3'); perfH.textContent = 'Rendimiento por responsable'; perf.appendChild(perfH);
    const rows = members.map(function (m) {
      const set = leaves.filter(function (r) { return r.assignee_id === m.id && (!dash.brand || rootIdOf(r) === dash.brand); });
      return {
        id: m.id, name: memberName(m.id),
        ini: set.filter(function (r) { return inRange(r.started_at, a, b); }).length,
        com: set.filter(function (r) { return inRange(r.completed_at, a, b); }).length,
        pen: set.filter(function (r) { return r.status === 'pending'; }).length
      };
    }).filter(function (r) { return r.ini || r.com || r.pen; });
    if (!rows.length) { const e = document.createElement('div'); e.className = 'dash-empty'; e.textContent = 'Sin actividad registrada en el periodo.'; perf.appendChild(e); }
    rows.sort(function (x, y) { return y.com - x.com; }).forEach(function (r) {
      const row = document.createElement('div'); row.className = 'perf-row';
      const nm = document.createElement('div'); nm.className = 'perf-name'; nm.textContent = r.name;
      const st = document.createElement('div'); st.className = 'perf-stats';
      st.innerHTML = '<span class="ps ini">' + r.ini + ' iniciadas</span><span class="ps com">' + r.com + ' completadas</span><span class="ps pen">' + r.pen + ' pendientes</span>';
      row.appendChild(nm); row.appendChild(st); perf.appendChild(row);
    });
    dashboardViewEl.appendChild(perf);

    // --- Secuencia histórica por día (completadas) ---
    const days = []; { let cur = startOfDay(a); const end = endOfDay(b); let guard = 0; while (cur.getTime() <= end.getTime() && guard < 366) { days.push(dayKey(cur)); cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 1); guard++; } }
    const seq = document.createElement('div'); seq.className = 'dash-block';
    const seqH = document.createElement('h3'); seqH.textContent = 'Secuencia diaria · completadas'; seq.appendChild(seqH);
    const scroll = document.createElement('div'); scroll.className = 'matrix-scroll';
    const tbl = document.createElement('table'); tbl.className = 'day-matrix';
    const thead = document.createElement('tr'); thead.appendChild(document.createElement('th'));
    days.forEach(function (d) { const th = document.createElement('th'); const dt = new Date(d + 'T00:00:00'); th.textContent = dt.getDate() + '/' + (dt.getMonth() + 1); thead.appendChild(th); });
    tbl.appendChild(thead);
    const perfMembers = members.filter(function (m) { return !dash.resp || m.id === dash.resp; });
    perfMembers.forEach(function (m) {
      const tr = document.createElement('tr');
      const nameTd = document.createElement('td'); nameTd.className = 'dm-name'; nameTd.textContent = memberName(m.id); tr.appendChild(nameTd);
      days.forEach(function (d) {
        const c = leaves.filter(function (r) { return r.assignee_id === m.id && (!dash.brand || rootIdOf(r) === dash.brand) && sameDay(r.completed_at, d); }).length;
        const td = document.createElement('td'); td.className = 'dm-cell' + (c ? ' has' : '');
        td.textContent = c || '·';
        if (c) { td.style.cursor = 'pointer'; td.title = 'Ver detalle'; td.addEventListener('click', function () { dashDrill = { person: m.id, day: d }; render(); }); }
        tr.appendChild(td);
      });
      tbl.appendChild(tr);
    });
    scroll.appendChild(tbl); seq.appendChild(scroll); dashboardViewEl.appendChild(seq);

    // --- Drill-down ---
    if (dashDrill) {
      const dd = document.createElement('div'); dd.className = 'dash-block drill';
      const h = document.createElement('h3'); h.textContent = memberName(dashDrill.person) + ' · ' + fmtFecha(dashDrill.day + 'T00:00:00');
      dd.appendChild(h);
      const list = leaves.filter(function (r) { return r.assignee_id === dashDrill.person && sameDay(r.completed_at, dashDrill.day); });
      if (!list.length) { const e = document.createElement('div'); e.className = 'dash-empty'; e.textContent = 'Sin actividades completadas ese día.'; dd.appendChild(e); }
      list.forEach(function (r) {
        const it = document.createElement('div'); it.className = 'drill-item';
        it.innerHTML = '<span class="di-check">✓</span> <span class="di-name">' + escapeHtml(r.title || '') + '</span> <span class="di-brand">' + escapeHtml(rootBrand(r)) + '</span>';
        dd.appendChild(it);
      });
      const close = document.createElement('button'); close.className = 'life-btn small'; close.textContent = 'Cerrar detalle'; close.addEventListener('click', function () { dashDrill = null; render(); });
      dd.appendChild(close);
      dashboardViewEl.appendChild(dd);
    }
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ---------------- Toggle Lista / Dashboard ----------------
  function updateToggle() {
    const tl = document.getElementById('toggleList'), td = document.getElementById('toggleDash');
    if (tl && td) { tl.classList.toggle('active', view === 'list'); td.classList.toggle('active', view === 'dashboard'); }
  }
  document.getElementById('toggleList').addEventListener('click', function () { view = 'list'; render(); });
  document.getElementById('toggleDash').addEventListener('click', function () { view = 'dashboard'; dashDrill = null; render(); });

  setAuthMode('signin');
})();
</script>
</body>
