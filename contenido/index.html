<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organizadísimos · Contenido</title>
<meta name="theme-color" content="#07050f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23140b24'/%3E%3Cpath d='M17 33.5l10 10L47 22' fill='none' stroke='%23b06bff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#07050f;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.08);--line:rgba(168,120,255,.22);--text:#ece7ff;--muted:#948bc4;--accent:#b06bff;--accent2:#35e5ff;--danger:#ff4d6d;--ok:#2ee6a6;--warn:#ff9f43}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center;position:relative;overflow-x:hidden}
  body::before,body::after{content:'';position:fixed;width:60vw;height:60vw;border-radius:50%;filter:blur(90px);opacity:.2;z-index:0;pointer-events:none}
  body::before{background:var(--accent);top:-20%;left:-15%}
  body::after{background:var(--accent2);bottom:-25%;right:-15%}
  h1{font-size:22px;margin:0;font-weight:700;background:linear-gradient(90deg,var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .wrap{width:100%;max-width:1180px;min-width:0;padding:26px 20px 90px;position:relative;z-index:1}
  #loginView{max-width:380px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .user-bar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;min-width:0;max-width:100%}
  .user-bar #whoami{min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav{display:flex;gap:6px;margin:14px 0 18px;flex-wrap:wrap}
  .nav a{font-size:13px;padding:6px 14px;border-radius:9px;text-decoration:none;color:var(--muted);border:1px solid transparent}
  .nav a:hover{color:var(--text)}
  .nav a.on{color:var(--text);border-color:var(--line);background:var(--panel)}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap;text-decoration:none;display:inline-block}
  .btn:hover{border-color:var(--accent2)}
  .btn.sm{padding:3px 9px;font-size:11.5px}
  .btn.danger{color:var(--danger);border-color:rgba(255,77,109,.4)}
  .pbtn{border:none;border-radius:9px;padding:9px 16px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#07050f;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .pbtn.sm{padding:6px 12px;font-size:12px}
  .pbtn:disabled{opacity:.5}
  input,textarea,select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:var(--panel);color:var(--text);outline:none;width:100%}
  input:focus,textarea:focus,select:focus{border-color:var(--accent2)}
  select option{background:#12102a}
  textarea{resize:vertical}
  .msg{font-size:13px;margin-top:12px;padding:9px 11px;border-radius:8px}
  .msg.error{background:rgba(255,77,109,.15);color:#ff8fa3}
  .msg.ok{background:rgba(46,230,166,.14);color:#8ff5d2}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
  .card{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--panel);margin-bottom:14px}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .hint{font-size:11.5px;color:var(--muted)}
  .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
  .empty{color:var(--muted);font-size:13px;padding:10px 2px}
  .x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 3px;line-height:1}
  .x:hover{color:var(--danger)}
  .hidden{display:none!important}

  /* Selector de vistas */
  .views{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border:1px solid var(--line);border-radius:11px;padding:4px;background:var(--panel);width:fit-content;max-width:100%}
  .views button{background:none;border:none;color:var(--muted);font-size:12.5px;padding:7px 13px;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .views button.on{background:var(--panel2);color:var(--text)}

  /* Estados (chips de color) */
  .pill{font-size:10px;border-radius:6px;padding:1px 7px;font-weight:600;white-space:nowrap;border:1px solid transparent;display:inline-block}
  .dotstate{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:inline-block}

  /* Dashboard */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
  .kpi{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:var(--panel)}
  .kpi .n{font-size:24px;font-weight:700}
  .kpi .k{font-size:11px;color:var(--muted);margin-top:2px}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:780px){.cols2{grid-template-columns:1fr}}
  .miniweek{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .wday{border:1px solid var(--line);border-radius:9px;padding:7px 5px;min-height:64px;background:var(--panel)}
  .wday .wd{font-size:9.5px;color:var(--muted);text-transform:uppercase}
  .wday .wn{font-size:14px;font-weight:700}
  .wday.hoy{border-color:var(--accent2)}
  .wchip{font-size:9.5px;background:var(--panel2);border-radius:5px;padding:1px 4px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .listrow{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .listrow:last-child{border-bottom:none}
  .listrow:hover{color:var(--text)}
  .listrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}

  /* Kanban */
  .kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}
  .kcol{flex:0 0 210px;border:1px solid var(--line);border-radius:11px;background:var(--panel);display:flex;flex-direction:column;max-height:70vh}
  .kcol.over{border-color:var(--accent2)}
  .kcol-h{display:flex;align-items:center;gap:7px;padding:9px 10px;border-bottom:1px solid var(--line)}
  .kcol-h b{font-size:12px}
  .kcol-h .c{font-size:10.5px;color:var(--muted);margin-left:auto}
  .kcol-b{padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;min-height:40px}
  .kcard{border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:var(--panel2);cursor:grab}
  .kcard:hover{border-color:var(--accent2)}
  .kcard.dragging{opacity:.4}
  .kcard .t{font-size:12.5px;font-weight:600;line-height:1.3}
  .kcard .m{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;align-items:center}
  .tagm{font-size:9.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}

  /* Tabla */
  .tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
  th:hover{color:var(--text)}
  td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:rgba(255,255,255,.03)}
  .grouphdr td{background:var(--panel2);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);cursor:default}

  /* Calendario */
  .calhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .caldow{font-size:10px;color:var(--muted);text-transform:uppercase;text-align:center;padding-bottom:3px}
  .calcell{border:1px solid var(--line);border-radius:8px;min-height:88px;padding:5px;background:var(--panel);display:flex;flex-direction:column;gap:3px}
  .calcell.off{opacity:.4}
  .calcell.hoy{border-color:var(--accent2)}
  .calcell.over{border-color:var(--accent2);background:var(--panel2)}
  .calcell .dn{font-size:11px;color:var(--muted)}
  .calchip{font-size:10px;border-radius:5px;padding:2px 5px;background:var(--panel2);cursor:grab;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid var(--muted)}
  .calchip.dragging{opacity:.4}

  /* Galería */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .gcard{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel);cursor:pointer}
  .gcard:hover{border-color:var(--accent2)}
  .gthumb{aspect-ratio:16/10;background:var(--panel2);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:11px}
  .gthumb img{width:100%;height:100%;object-fit:cover}
  .gbody{padding:9px 10px}
  .gbody .t{font-size:12.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Detalle */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 16px;flex-wrap:wrap}
  .tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:13px;padding:8px 13px;cursor:pointer;font-family:inherit;margin-bottom:-1px}
  .tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
  .flowbar{display:flex;gap:3px;flex-wrap:wrap;margin:10px 0}
  .flowstep{font-size:10px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);cursor:pointer}
  .flowstep.done{color:#07050f;font-weight:700}
  .flowstep.cur{outline:2px solid var(--accent2)}
  .filekind{display:inline-block;font-size:9.5px;border-radius:5px;padding:1px 6px;background:rgba(176,107,255,.14);color:#d9bcff;margin-right:6px}
  .filerow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
  .filerow:last-child{border-bottom:none}
  .copyfield{margin-bottom:12px}
  .verrow,.logitem{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;background:var(--panel)}
  .timeline{position:relative;margin-left:5px;padding-left:16px;border-left:1px solid var(--line)}
  .tl-item{position:relative;padding:6px 2px}
  .tl-dot{position:absolute;left:-21px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-sizing:content-box}
  .tl-act{font-size:12.5px;font-weight:600}
  .tl-meta{font-size:11px;color:var(--muted)}
  .soon{opacity:.55}
  .badge-soon{font-size:9px;text-transform:uppercase;letter-spacing:.4px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted);margin-left:6px}
</style>
</head>
<body>

<div class="wrap hidden" id="loginView">
  <h1>Organizadísimos</h1>
  <p class="hint" style="margin:6px 0 22px">Inicia sesión para entrar a Gestión de Contenido.</p>
  <div class="field"><label>Correo</label><input type="email" id="email" placeholder="tu@correo.com"></div>
  <div class="field"><label>Contraseña</label><input type="password" id="password" placeholder="••••••••"></div>
  <button class="pbtn" style="width:100%" id="loginBtn">Entrar</button>
  <div id="loginMsg"></div>
</div>

<div class="wrap hidden" id="appView">
  <div class="topbar">
    <h1>Organizadísimos</h1>
    <div class="user-bar"><span id="whoami"></span><button class="btn" id="outBtn">Salir</button></div>
  </div>
  <div class="nav">
    <a href="/dashboard/">Tareas</a>
    <a href="/proyectos/">Proyectos</a>
    <a href="/contenido/" class="on">Contenido</a>
  </div>
  <div id="body"></div>
</div>

<script>
(function () {
  var URL_SB = 'https://hwisrkincpkkdqrxuoch.supabase.co';
  var KEY = 'sb_publishable_TnJBE9EIVVra1x22ilN25Q_qgfMG1EC';
  var sb = window.supabase.createClient(URL_SB, KEY);
  var $ = function (i) { return document.getElementById(i); };

  var me = null, cuenta = null, bloqueo = null;
  var items = [], marcas = [], vista = 'dashboard', abiertoId = null, pestana = 'info';
  var arrastreId = null, calRef = new Date(), tblSort = { col: 'created_at', dir: -1 }, tblFiltro = { status: '', brand: '', platform: '' }, tblGroup = false, bibKind = 'hook';

  // Flujo del contenido (orden y color de cada estado).
  var ESTADOS = [
    ['idea', 'Idea', '#948bc4'], ['guion', 'Guion', '#5b8cff'], ['grabacion', 'Grabación', '#22d3ee'],
    ['edicion', 'Edición', '#35e5ff'], ['revision', 'Revisión', '#b06bff'], ['correcciones', 'Correcciones', '#ff9f43'],
    ['aprobado', 'Aprobado', '#a3e635'], ['programado', 'Programado', '#f7d154'], ['publicado', 'Publicado', '#2ee6a6'],
    ['archivado', 'Archivado', '#6b6688']
  ];
  var FORMATOS = [['reel', 'Reel'], ['short', 'Short'], ['carrusel', 'Carrusel'], ['historia', 'Historia'], ['video', 'Video'], ['imagen', 'Imagen'], ['otro', 'Otro']];
  var PLATAFORMAS = ['Instagram', 'TikTok', 'YouTube', 'Facebook', 'LinkedIn', 'X', 'Otro'];
  var TIPOS_ARCHIVO = [['video_original', 'Video original'], ['video_editado', 'Video editado'], ['miniatura', 'Miniatura'], ['imagen', 'Imagen'], ['psd', 'PSD'], ['canva', 'Canva'], ['capcut', 'CapCut'], ['otro', 'Otro']];
  var COPY_FIELDS = [['principal', 'Copy principal'], ['cta', 'CTA'], ['hashtags', 'Hashtags'], ['first_comment', 'Primer comentario'], ['youtube', 'Descripción de YouTube'], ['tiktok', 'Texto para TikTok'], ['facebook', 'Texto para Facebook']];
  var ESTADO_MAP = {}; ESTADOS.forEach(function (e) { ESTADO_MAP[e[0]] = e; });
  var FORMATO_MAP = {}; FORMATOS.forEach(function (f) { FORMATO_MAP[f[0]] = f[1]; });

  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function msg(elm, t, k) { elm.innerHTML = t ? '<div class="msg ' + k + '">' + t + '</div>' : ''; }
  function hoyISO() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  var MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
  var MESES_L = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  var DOW = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
  function fechaCorta(iso) { var p = String(iso || '').slice(0, 10).split('-'); if (p.length !== 3) return ''; return parseInt(p[2], 10) + ' ' + MESES[parseInt(p[1], 10) - 1]; }
  function fechaHora(iso) { if (!iso) return ''; var d = new Date(iso); return d.getDate() + ' ' + MESES[d.getMonth()] + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function marcaNombre(id) { var m = marcas.find(function (x) { return x.id === id; }); return m ? m.name : ''; }
  function pillEstado(st) { var e = ESTADO_MAP[st] || ESTADO_MAP.idea; var s = el('span', 'pill', e[1]); s.style.color = e[2]; s.style.borderColor = e[2]; return s; }
  function copyOf(it) { return (it && it.copy && typeof it.copy === 'object') ? it.copy : {}; }

  // ---------------- Acceso ----------------
  $('loginBtn').addEventListener('click', entrar);
  $('password').addEventListener('keydown', function (e) { if (e.key === 'Enter') entrar(); });
  $('outBtn').addEventListener('click', function () { sb.auth.signOut(); });

  async function entrar() {
    var e = $('email').value.trim(), p = $('password').value;
    if (!e || !p) { msg($('loginMsg'), 'Completa correo y contraseña.', 'error'); return; }
    $('loginBtn').disabled = true; msg($('loginMsg'), '', '');
    var r = await sb.auth.signInWithPassword({ email: e, password: p });
    $('loginBtn').disabled = false;
    if (r.error) msg($('loginMsg'), r.error.message, 'error');
  }

  sb.auth.onAuthStateChange(async function (_ev, s) {
    if (s && s.user) {
      var a = await sb.rpc('is_active_user');
      if (a.error || !a.data) { bloqueo = 'Tu cuenta está desactivada. Contacta al administrador.'; await sb.auth.signOut(); return; }
      me = s.user;
      var pr = await sb.from('profiles').select('account_id').eq('id', me.id).maybeSingle();
      cuenta = pr.data ? pr.data.account_id : null;
      $('whoami').textContent = me.email;
      $('loginView').classList.add('hidden');
      $('appView').classList.remove('hidden');
      cargar();
    } else {
      me = null;
      $('appView').classList.add('hidden');
      $('loginView').classList.remove('hidden');
      if (bloqueo) { msg($('loginMsg'), bloqueo, 'error'); bloqueo = null; }
    }
  });

  // ---------------- Carga ----------------
  async function cargar() {
    $('body').innerHTML = '<div class="empty">Cargando…</div>';
    var res = await Promise.all([
      sb.from('content_items').select('*').order('created_at', { ascending: false }),
      sb.from('content_brands').select('*').order('name')
    ]);
    if (res[0].error) { $('body').innerHTML = '<div class="msg error">' + res[0].error.message + '</div>'; return; }
    items = (res[0].data || []).map(function (it) { it.copy = copyOf(it); return it; });
    marcas = res[1].data || [];
    abrirDesdeURL();
  }

  function abrirDesdeURL() {
    var q = new URLSearchParams(location.search);
    var c = q.get('c');
    if (c && items.some(function (x) { return x.id === c; })) { abiertoId = c; pintarDetalle(); }
    else { abiertoId = null; pintar(); }
  }
  window.addEventListener('popstate', abrirDesdeURL);

  async function guardarItem(it, campos) {
    Object.assign(it, campos); it.updated_at = new Date().toISOString();
    var r = await sb.from('content_items').update(campos).eq('id', it.id);
    if (r.error) alert('No se pudo guardar: ' + r.error.message);
  }
  async function regLog(contentId, action, detail) {
    var r = await sb.from('content_log').insert({ content_id: contentId, account_id: cuenta, action: action, detail: detail || null, created_by: me.id });
    if (r.error) console.warn('log', r.error.message);
  }

  // ---------------- Cabecera + selector de vistas ----------------
  function pintar() {
    abiertoId = null;
    var b = $('body'); b.innerHTML = '';

    var top = el('div', 'row'); top.style.justifyContent = 'space-between'; top.style.marginBottom = '4px';
    var vs = el('div', 'views');
    [['dashboard', 'Dashboard'], ['kanban', 'Kanban'], ['tabla', 'Tabla'], ['calendario', 'Calendario'], ['galeria', 'Galería'], ['biblioteca', 'Biblioteca'], ['marcas', 'Marcas']].forEach(function (v) {
      var x = el('button', vista === v[0] ? 'on' : '', v[1]);
      x.onclick = function () { vista = v[0]; pintar(); };
      vs.appendChild(x);
    });
    top.appendChild(vs);
    var nuevo = el('button', 'pbtn sm', '+ Nuevo contenido');
    nuevo.onclick = crearContenido;
    top.appendChild(nuevo);
    b.appendChild(top);

    var zona = el('div'); b.appendChild(zona);
    if (vista === 'dashboard') pintarDashboard(zona);
    else if (vista === 'kanban') pintarKanban(zona);
    else if (vista === 'tabla') pintarTabla(zona);
    else if (vista === 'calendario') pintarCalendario(zona);
    else if (vista === 'galeria') pintarGaleria(zona);
    else if (vista === 'biblioteca') pintarBiblioteca(zona);
    else if (vista === 'marcas') pintarMarcas(zona);
  }

  async function crearContenido() {
    var r = await sb.from('content_items').insert({ account_id: cuenta, owner_id: me.id, name: 'Nuevo contenido', status: 'idea' }).select('*').single();
    if (r.error) { alert('No se pudo crear: ' + r.error.message); return; }
    r.data.copy = {}; items.unshift(r.data);
    regLog(r.data.id, 'Se creó el contenido', null);
    abrir(r.data.id);
  }

  function abrir(id) { abiertoId = id; pestana = 'info'; history.pushState({}, '', '?c=' + id); pintarDetalle(); }

  // ---------------- Dashboard ----------------
  function pintarDashboard(z) {
    var porEstado = {}; ESTADOS.forEach(function (e) { porEstado[e[0]] = 0; });
    items.forEach(function (it) { if (porEstado[it.status] != null) porEstado[it.status]++; });

    // Tarjetas de estado destacadas
    var destacados = [['idea', 'Pendiente'], ['edicion', 'En edición'], ['revision', 'En revisión'], ['programado', 'Programado'], ['publicado', 'Publicado']];
    var kp = el('div', 'kpis');
    destacados.forEach(function (d) {

      if (i <= idx) s.style.background = e[2];
      s.title = 'Marcar como ' + e[1];
      s.onclick = function () { if (e[0] !== it.status) moverEstadoDetalle(it, e[0]); };
      flow.appendChild(s);
    });
    b.appendChild(flow);

    var tabs = el('div', 'tabs');
    [['info', 'Información'], ['archivos', 'Archivos'], ['copy', 'Copy'], ['versiones', 'Versiones'], ['ia', 'IA'], ['historial', 'Historial']].forEach(function (t) {
      var x = el('button', pestana === t[0] ? 'on' : '', t[1]);
      x.onclick = function () { pestana = t[0]; pintarDetalle(); };
      tabs.appendChild(x);
    });
    b.appendChild(tabs);

    var zona = el('div'); b.appendChild(zona);
    if (pestana === 'info') tabInfo(zona, it);
    else if (pestana === 'archivos') tabArchivos(zona, it);
    else if (pestana === 'copy') tabCopy(zona, it);
    else if (pestana === 'versiones') tabVersiones(zona, it);
    else if (pestana === 'ia') tabIA(zona, it);
    else if (pestana === 'historial') tabHistorial(zona, it);
  }

  async function moverEstadoDetalle(it, nuevo) {
    var antes = ESTADO_MAP[it.status][1], desp = ESTADO_MAP[nuevo][1];
    await guardarItem(it, { status: nuevo });
    regLog(it.id, 'Se cambió el estado', antes + ' → ' + desp);
    pintarDetalle();
  }

  // ---- Información ----
  function tabInfo(z, it) {
    var c = el('div', 'card');
    var g = el('div', 'grid');
    function campo(lbl, node) { var w = el('div'); w.appendChild(el('div', 'lbl', lbl)); node.style.marginTop = '4px'; w.appendChild(node); return w; }
    function texto(key, ph) { var i = el('input'); i.placeholder = ph || ''; i.value = it[key] || ''; i.onblur = function () { if ((it[key] || '') !== i.value) guardarItem(it, defObj(key, i.value || null)); }; return i; }
    function defObj(k, v) { var o = {}; o[k] = v; return o; }

    // Marca (select) + cliente libre
    var selMarca = el('select');
    var o0 = el('option', null, '— Sin marca —'); o0.value = ''; selMarca.appendChild(o0);
    marcas.forEach(function (m) { var op = el('option', null, m.name); op.value = m.id; if (it.brand_id === m.id) op.selected = true; selMarca.appendChild(op); });
    selMarca.onchange = function () { guardarItem(it, { brand_id: selMarca.value || null }); };
    g.appendChild(campo('Marca', selMarca));
    g.appendChild(campo('Cliente', texto('client', 'Cliente')));

    var selPlat = el('select');
    var p0 = el('option', null, '—'); p0.value = ''; selPlat.appendChild(p0);
    PLATAFORMAS.forEach(function (p) { var op = el('option', null, p); op.value = p; if (it.platform === p) op.selected = true; selPlat.appendChild(op); });
    selPlat.onchange = function () { guardarItem(it, { platform: selPlat.value || null }); };
    g.appendChild(campo('Plataforma', selPlat));

    var selFmt = el('select');
    FORMATOS.forEach(function (f) { var op = el('option', null, f[1]); op.value = f[0]; if (it.format === f[0]) op.selected = true; selFmt.appendChild(op); });
    selFmt.onchange = function () { guardarItem(it, { format: selFmt.value }); };
    g.appendChild(campo('Formato', selFmt));

    g.appendChild(campo('Responsable', texto('responsible', 'Responsable')));
    g.appendChild(campo('Categoría', texto('category', 'Categoría')));

    var fp = el('input'); fp.type = 'date'; fp.value = it.publish_at || '';
    fp.onchange = function () { guardarItem(it, { publish_at: fp.value || null }); };
    g.appendChild(campo('Fecha de publicación', fp));
    var fc = el('input'); fc.value = String(it.created_at || '').slice(0, 10); fc.disabled = true;
    g.appendChild(campo('Fecha de creación', fc));
    c.appendChild(g);

    // Campos largos
    var g2 = el('div'); g2.style.marginTop = '4px';
    [['objective', 'Objetivo'], ['offer', 'Oferta'], ['avatar', 'Avatar'], ['hook', 'Hook'], ['cta', 'CTA']].forEach(function (cp) {
      var w = el('div', 'copyfield'); w.appendChild(el('div', 'lbl', cp[1]));
      var ta = el('textarea'); ta.rows = 2; ta.value = it[cp[0]] || ''; ta.style.marginTop = '3px';
      ta.onblur = function () { if ((it[cp[0]] || '') !== ta.value) { var o = {}; o[cp[0]] = ta.value || null; guardarItem(it, o); } };
      w.appendChild(ta); g2.appendChild(w);
    });
    c.appendChild(g2);
    z.appendChild(c);
  }

  // ---- Archivos ----
  function tabArchivos(z, it) {
    var c = el('div', 'card');
    c.appendChild(el('div', 'lbl', 'Agregar archivo'));
    var fila = el('div', 'grid'); fila.style.marginTop = '9px';
    var selKind = el('select');
    TIPOS_ARCHIVO.forEach(function (k) { var op = el('option', null, k[1]); op.value = k[0]; selKind.appendChild(op); });
    var wk = el('div'); wk.appendChild(el('div', 'lbl', 'Tipo')); selKind.style.marginTop = '3px'; wk.appendChild(selKind);
    fila.appendChild(wk);
    c.appendChild(fila);

    var acc = el('div', 'row'); acc.style.marginTop = '10px';
    var subir = el('button', 'pbtn sm', 'Subir archivo');
    var fileInp = el('input'); fileInp.type = 'file'; fileInp.style.display = 'none';
    subir.onclick = function () { fileInp.click(); };
    var estado = el('span', 'hint');
    fileInp.onchange = async function () {
      var f = fileInp.files[0]; if (!f) return;
      estado.textContent = 'Subiendo ' + f.name + '…'; subir.disabled = true;
      var path = cuenta + '/' + it.id + '/' + Date.now() + '_' + f.name.replace(/[^\w.\-]/g, '_');
      var up = await sb.storage.from('content').upload(path, f, { upsert: false });
      if (up.error) { estado.textContent = ''; subir.disabled = false; alert('No se pudo subir: ' + up.error.message + '\nPuedes pegar un enlace externo mientras tanto.'); return; }
      var pub = sb.storage.from('content').getPublicUrl(path);
      var url = pub.data ? pub.data.publicUrl : null;
      var r = await sb.from('content_files').insert({ content_id: it.id, account_id: cuenta, kind: selKind.value, name: f.name, url: url, storage_path: path, size: f.size, created_by: me.id }).select('*').single();
      subir.disabled = false; estado.textContent = ''; fileInp.value = '';
      if (r.error) { alert(r.error.message); return; }
      regLog(it.id, 'Se agregó un archivo', f.name);
      miniCargadas = false; tabArchivos(z0(z), it);
    };
    acc.appendChild(subir); acc.appendChild(fileInp); acc.appendChild(estado);
    c.appendChild(acc);

    // Enlace externo (Drive, Dropbox…)
    var linkRow = el('div', 'row'); linkRow.style.marginTop = '9px';
    var linkInp = el('input'); linkInp.placeholder = '…o pega un enlace (Drive, Dropbox, YouTube)';
    var linkName = el('input'); linkName.placeholder = 'Nombre'; linkName.style.maxWidth = '160px';
    var linkBtn = el('button', 'btn sm', 'Añadir enlace');
    linkBtn.onclick = async function () {
      var u = linkInp.value.trim(); if (!u) return;
      var r = await sb.from('content_files').insert({ content_id: it.id, account_id: cuenta, kind: selKind.value, name: linkName.value.trim() || u, url: u, created_by: me.id }).select('*').single();
      if (r.error) { alert(r.error.message); return; }
      regLog(it.id, 'Se agregó un archivo (enlace)', linkName.value.trim() || u);
      miniCargadas = false; tabArchivos(z0(z), it);
    };
    linkRow.appendChild(linkInp); linkRow.appendChild(linkName); linkRow.appendChild(linkBtn);
    c.appendChild(linkRow);
    z.appendChild(c);

    var cont = el('div'); z.appendChild(cont);
    cont.innerHTML = '<div class="empty">Cargando archivos…</div>';
    sb.from('content_files').select('*').eq('content_id', it.id).order('created_at', { ascending: false }).then(function (r) {
      cont.innerHTML = '';
      if (r.error) { cont.innerHTML = '<div class="msg error">' + r.error.message + '</div>'; return; }
      if (!(r.data || []).length) { cont.appendChild(el('div', 'empty', 'Sin archivos todavía.')); return; }
      var kindMap = {}; TIPOS_ARCHIVO.forEach(function (k) { kindMap[k[0]] = k[1]; });
      r.data.forEach(function (fl) {
        var row = el('div', 'filerow');
        row.appendChild(el('span', 'filekind', kindMap[fl.kind] || fl.kind));
        var a = fl.url ? el('a', null, fl.name) : el('span', null, fl.name);
        if (fl.url) { a.href = fl.url; a.target = '_blank'; a.style.color = 'var(--accent2)'; a.style.textDecoration = 'none'; }
        a.style.flex = '1'; a.style.minWidth = '0'; a.style.overflow = 'hidden'; a.style.textOverflow = 'ellipsis'; a.style.whiteSpace = 'nowrap';
        row.appendChild(a);
        if (fl.size) row.appendChild(el('span', 'hint', (fl.size / 1024 / 1024).toFixed(2) + ' MB'));
        var x = el('button', 'x', '✕'); x.title = 'Eliminar';
        x.onclick = async function () {
          if (!confirm('¿Eliminar "' + fl.name + '"?')) return;
          if (fl.storage_path) await sb.storage.from('content').remove([fl.storage_path]);
          await sb.from('content_files').delete().eq('id', fl.id);
          regLog(it.id, 'Se eliminó un archivo', fl.name);
          miniCargadas = false; tabArchivos(z0(z), it);
        };
        row.appendChild(x);
        cont.appendChild(row);
      });
    });
  }
  // Limpia el contenedor de la pestaña para repintarla sin recargar todo el detalle.
  function z0(z) { z.innerHTML = ''; return z; }

  // ---- Copy ----
  function tabCopy(z, it) {
    var cp = copyOf(it);
    var c = el('div', 'card');
    c.appendChild(el('div', 'lbl', 'Editor de copy'));
    COPY_FIELDS.forEach(function (cf) {
      var w = el('div', 'copyfield'); w.appendChild(el('div', 'lbl', cf[1]));
      var ta = el('textarea'); ta.rows = cf[0] === 'principal' || cf[0] === 'youtube' ? 5 : 2; ta.value = cp[cf[0]] || ''; ta.style.marginTop = '3px';
      ta.onblur = function () {
        if ((cp[cf[0]] || '') === ta.value) return;
        cp[cf[0]] = ta.value; it.copy = cp;
        guardarItem(it, { copy: cp });
      };
      w.appendChild(ta); c.appendChild(w);
    });
    var acc = el('div', 'row'); acc.style.marginTop = '6px';
    var notaV = el('input'); notaV.placeholder = 'Nota de la versión (opcional)'; notaV.style.maxWidth = '260px';
    var bt = el('button', 'pbtn sm', 'Guardar versión');
    bt.onclick = async function () {
      var ver = await siguienteVersion(it.id);
      var r = await sb.from('content_versions').insert({ content_id: it.id, account_id: cuenta, n: ver, copy: it.copy || {}, note: notaV.value.trim() || null, created_by: me.id }).select('*').single();
      if (r.error) { alert(r.error.message); return; }
      regLog(it.id, 'Se guardó la versión ' + ver, notaV.value.trim() || null);
      notaV.value = ''; alert('Versión ' + ver + ' guardada.');
    };
    acc.appendChild(notaV); acc.appendChild(bt);
    c.appendChild(acc);
    c.appendChild(el('div', 'hint', 'El texto se guarda automáticamente al salir de cada campo. “Guardar versión” crea un punto en el historial que nunca se pierde.'));
    z.appendChild(c);
  }
  async function siguienteVersion(contentId) {
    var r = await sb.from('content_versions').select('n').eq('content_id', contentId).order('n', { ascending: false }).limit(1);
    if (r.error || !r.data || !r.data.length) return 1;
    return (r.data[0].n || 0) + 1;
  }

  // ---- Versiones ----
  function tabVersiones(z, it) {
    var cont = el('div'); cont.innerHTML = '<div class="empty">Cargando versiones…</div>'; z.appendChild(cont);
    sb.from('content_versions').select('*').eq('content_id', it.id).order('n', { ascending: false }).then(function (r) {
      cont.innerHTML = '';
      if (r.error) { cont.innerHTML = '<div class="msg error">' + r.error.message + '</div>'; return; }
      if (!(r.data || []).length) { cont.appendChild(el('div', 'empty', 'Aún no hay versiones. Guarda una desde la pestaña Copy.')); return; }
      r.data.forEach(function (v) {
        var box = el('div', 'verrow');
        var h = el('div', 'row'); h.style.justifyContent = 'space-between';
        h.appendChild(el('b', null, 'Versión ' + v.n));
        h.appendChild(el('span', 'hint', fechaHora(v.created_at)));
        box.appendChild(h);
        if (v.note) box.appendChild(el('div', 'hint', v.note));
        var vc = (v.copy && typeof v.copy === 'object') ? v.copy : {};
        var prev = vc.principal || vc.cta || '(sin copy principal)';
        var p = el('div', null, prev.length > 160 ? prev.slice(0, 160) + '…' : prev); p.style.fontSize = '12.5px'; p.style.marginTop = '6px'; p.style.whiteSpace = 'pre-wrap';
        box.appendChild(p);
        var rest = el('button', 'btn sm', 'Restaurar esta versión'); rest.style.marginTop = '8px';
        rest.onclick = async function () {
          if (!confirm('¿Restaurar el copy de la versión ' + v.n + '? El copy actual se sobrescribe (guarda una versión antes si quieres conservarlo).')) return;
          it.copy = vc; await guardarItem(it, { copy: vc });
          regLog(it.id, 'Se restauró la versión ' + v.n, null);
          pestana = 'copy'; pintarDetalle();
        };
        box.appendChild(rest);
        cont.appendChild(box);
      });
    });
  }

  // ---- IA (diseñada, implementación en fase posterior) ----
  function tabIA(z, it) {
    var c = el('div', 'card soon');
    var h = el('div', 'row');
    h.appendChild(el('b', null, 'Asistente de IA de este contenido'));
    h.appendChild(el('span', 'badge-soon', 'Próximamente'));
    c.appendChild(h);
    c.appendChild(el('div', 'hint', 'Trabajará únicamente sobre esta pieza y usará la memoria de su marca y las bibliotecas. Se activa en una fase posterior.'));
    var acc = el('div', 'row'); acc.style.marginTop = '12px';
    ['Generar copy', 'Crear 5 hooks', 'Versión emocional', 'Adaptar a Puerto Rico', 'Adaptar a Realtors', 'Adaptar a Coaches', 'Crear un carrusel', 'Resumir el video'].forEach(function (a) {
      var b = el('button', 'btn sm', a); b.disabled = true; b.style.opacity = '.6'; acc.appendChild(b);
    });
    c.appendChild(acc);
    z.appendChild(c);
  }

  // ---- Historial ----
  function tabHistorial(z, it) {
    var cont = el('div'); cont.innerHTML = '<div class="empty">Cargando historial…</div>'; z.appendChild(cont);
    sb.from('content_log').select('*').eq('content_id', it.id).order('created_at', { ascending: false }).then(function (r) {
      cont.innerHTML = '';
      if (r.error) { cont.innerHTML = '<div class="msg error">' + r.error.message + '</div>'; return; }
      if (!(r.data || []).length) { cont.appendChild(el('div', 'empty', 'Sin cambios registrados todavía.')); return; }
      var tl = el('div', 'timeline');
      r.data.forEach(function (e) {
        var item = el('div', 'tl-item');
        item.appendChild(el('span', 'tl-dot'));
        item.appendChild(el('div', 'tl-act', e.action + (e.detail ? ': ' + e.detail : '')));
        item.appendChild(el('div', 'tl-meta', fechaHora(e.created_at)));
        tl.appendChild(item);
      });
      cont.appendChild(tl);
    });
  }
})();
</script>
</body>
</html>
