<style>

  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center;position:relative;overflow-x:hidden}
  body::before,body::after{content:'';position:fixed;width:60vw;height:60vw;border-radius:50%;filter:blur(90px);opacity:.2;z-index:0;pointer-events:none}
  body::before{background:var(--accent);top:-20%;left:-15%}
  body::after{background:var(--accent2);bottom:-25%;right:-15%}

  .nav a:hover{color:var(--text)}
  .nav a.on{color:var(--text);border-color:var(--line);background:var(--panel)}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap;text-decoration:none;display:inline-block}
  .btn:hover{border-color:var(--accent2)}
  .btn.sm{padding:3px 9px;font-size:11.5px}
  .btn.danger{color:var(--danger);border-color:rgba(255,77,109,.4)}
  .pbtn{border:none;border-radius:9px;padding:9px 16px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#07050f;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .pbtn.sm{padding:6px 12px;font-size:12px}
  .pbtn:disabled{opacity:.45;cursor:default}
  input,textarea,select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:var(--panel);color:var(--text);outline:none;width:100%}
  input:focus,textarea:focus,select:focus{border-color:var(--accent2)}
  select option{background:#12102a}
  textarea{resize:vertical}
  .msg{font-size:13px;margin-top:12px;padding:9px 11px;border-radius:8px}
  .msg.error{background:rgba(255,77,109,.15);color:#ff8fa3}
  .msg.ok{background:rgba(46,230,166,.14);color:#8ff5d2}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
  .card{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--panel);margin-bottom:14px}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .hint{font-size:11.5px;color:var(--muted)}
  .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
  .empty{color:var(--muted);font-size:13px;padding:10px 2px}
  .x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 3px;line-height:1}
  .x:hover{color:var(--danger)}
  .hidden{display:none!important}

  /* Selector de proyectos (marcas) */
  .projgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .projcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);cursor:pointer;transition:border-color .15s}
  .projcard:hover{border-color:var(--accent2)}
  .projlogo{height:96px;background:linear-gradient(135deg,rgba(176,107,255,.25),rgba(53,229,255,.18));display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#fff;overflow:hidden}

  .dotstate{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:inline-block}

  .kcol{flex:0 0 210px;border:1px solid var(--line);border-radius:11px;background:var(--panel);display:flex;flex-direction:column;max-height:70vh}
  .kcol.over{border-color:var(--accent2)}
  .kcol-h{display:flex;align-items:center;gap:7px;padding:9px 10px;border-bottom:1px solid var(--line)}
  .kcol-h b{font-size:12px}
  .kcol-h .c{font-size:10.5px;color:var(--muted);margin-left:auto}
  .kcol-b{padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;min-height:40px}
  .kcard{border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:var(--panel2);cursor:grab}
  .kcard:hover{border-color:var(--accent2)}
  .kcard.dragging{opacity:.4}
  .kcard .t{font-size:12.5px;font-weight:600;line-height:1.3}
  .kcard .m{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;align-items:center}
  .tagm{font-size:9.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}

  /* Tabla */
  .tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
  th:hover{color:var(--text)}
  td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}

  .grouphdr td{background:var(--panel2);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);cursor:default}

  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .caldow{font-size:10px;color:var(--muted);text-transform:uppercase;text-align:center;padding-bottom:3px}
  .calcell{border:1px solid var(--line);border-radius:8px;min-height:88px;padding:5px;background:var(--panel);display:flex;flex-direction:column;gap:3px}

  .calcell.over{border-color:var(--accent2);background:var(--panel2)}

  /* Galería */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .gcard{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel);cursor:pointer}
  .gcard:hover{border-color:var(--accent2)}

  /* Detalle */
  .metabar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin:6px 0 4px}
  .flowbar{display:flex;gap:3px;flex-wrap:wrap;margin:10px 0}
  .flowstep{font-size:10px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);cursor:pointer}
  .flowstep.done{color:#07050f;font-weight:700}
  .flowstep.cur{outline:2px solid var(--accent2)}

  .imgwrap{border-radius:9px;overflow:hidden;background:var(--panel2);display:flex;align-items:center;justify-content:center}
  .imgwrap img{max-width:100%;max-height:420px;object-fit:contain}
  .noviz{aspect-ratio:16/10;border:1px dashed var(--line);border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12.5px;text-align:center;padding:12px}
  .fileinfo{font-size:11.5px;color:var(--muted)}
  .carou-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .guionblock{margin-bottom:11px}
  .guionblock .lbl{margin-bottom:4px}
  .saverow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
  .savestate{font-size:11.5px}
  .savestate.dirty{color:var(--warn)}
  .savestate.ok{color:var(--ok)}
  .savestate.err{color:#ff8fa3}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:6px 0 16px;flex-wrap:wrap}
  .tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:12.5px;padding:8px 12px;cursor:pointer;font-family:inherit;margin-bottom:-1px}
  .tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
  .filekind{display:inline-block;font-size:9.5px;border-radius:5px;padding:1px 6px;background:rgba(176,107,255,.14);color:#d9bcff;margin-right:6px}
  .filerow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
  .filerow:last-child{border-bottom:none}
  .copyfield{margin-bottom:12px}
  .verrow,.logitem{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;background:var(--panel)}
  .timeline{position:relative;margin-left:5px;padding-left:16px;border-left:1px solid var(--line)}
  .tl-item{position:relative;padding:6px 2px}
  .tl-dot{position:absolute;left:-21px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-sizing:content-box}
  .tl-act{font-size:12.5px;font-weight:600}
  .tl-meta{font-size:11px;color:var(--muted)}
  .stars{display:inline-flex;gap:3px}
  .star{cursor:pointer;font-size:19px;color:var(--line);line-height:1}
  .star.on{color:var(--warn)}
  .chipset{display:flex;gap:6px;flex-wrap:wrap}
  .chiptoggle{font-size:11px;border:1px solid var(--line);border-radius:16px;padding:3px 10px;cursor:pointer;color:var(--muted)}
  .chiptoggle.on{background:var(--accent);color:#07050f;border-color:var(--accent);font-weight:600}
  .soon{opacity:.6}
  .badge-soon{font-size:9px;text-transform:uppercase;letter-spacing:.4px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted);margin-left:6px}
</style>
</head>

    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }
